$type: markdown

summary: 富文本。创建时写源码并可预览，进行与终结时只读

schema:
  type: object
  required: [$type]
  properties:
    $type:
      const: markdown
    value:
      type: string
    placeholder:
      type: string
  additionalProperties: true

# ── 渲染器 ──
# 每态一个函数。active 与 ended 用同一个函数（只读渲染），这是允许的。
renderer:
  create: markdownCreate
  active: markdownView
  ended: markdownView
  plain: markdownPlain
