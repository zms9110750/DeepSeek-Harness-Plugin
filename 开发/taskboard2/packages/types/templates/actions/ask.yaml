$type: ask

summary: 选项选择，单选或多选，恒有「未选择」和自填框

schema:
  type: object
  required: [$type, items]
  properties:
    $type:
      const: ask
    items:
      type: array
      minItems: 1
      items:
        type: object
        required: [options]
        properties:
          header:
            type: string
          question:
            type: string
          options:
            type: array
            items:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                description:
                  type: string
              additionalProperties: true
          multi_select:
            type: boolean
            default: false
          picked:
            type: array
            items:
              type: string
          custom:
            type: array
            items:
              type: string
          placeholder:
            type: string
        additionalProperties: true
  additionalProperties: true

# ── picked 的三态 ──
#   字段不存在  → 未选择
#   []         → 看了，但都不要
#   ["A"]      → 选了 A
# 自填值不进 picked，进 custom。

# ── 渲染器 ──
# create 与 active 用同一个函数（交互相同），ended 只读，plain 纯文本。
renderer:
  create: askEditable
  active: askEditable
  ended: askEnded
  plain: askPlain
