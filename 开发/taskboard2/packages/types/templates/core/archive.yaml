name: archive
displayName: 留档
kind: record
domain: 核心
codePrefix: A

usage: |
  有东西要留着，记下来。并且不需要用户介入的事情。
  例如执行工作时踩坑了，或者描述用户的风格。

description: |
  本卡是记录类。建出来直接是「需要授权」，只有用户能转成功或失败。
  本卡的语义是不需要用户交互，但不意味着ai的判断对了。
  用户总是可以追认和否认。不应该预设没有赘肉的留档是确有其事。

  后续创建新的任务时，如果留档对其相关，例如有未解决的问题，用户的风格偏好描述，
  把本卡列为参考或约束。

derive: []

sections:
  what:
    label: 留档内容
    hint: |
      描述客观问题时（例如环境状态），使用提交后不可交互的组件。
      描述主观问题时（例如用户风格），使用可填写的文本框。
      组件初始内容放要保留的资料本身。
    default:
      $type: markdown

  why:
    label: 留档适用性
    hint: |
      需要一个提交后不可交互组件，展示内容。
      写清楚以后什么情况下会用到它。
      或者描述这个留档是在描述的性质，范围。
    default:
      $type: markdown