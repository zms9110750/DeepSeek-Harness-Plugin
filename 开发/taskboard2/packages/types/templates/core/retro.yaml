name: retro
displayName: 复盘
kind: record
domain: 核心
codePrefix: P

usage: |
  一批失败之后，写清楚缺什么信息、以及凭什么相信下一次。

description: |
  本卡是记录类。建出来直接是「需要授权」，只有用户能转成功或失败。

  本卡不是「事后总结报告」，不写事件经过，也不写教训。
  它只回答三个问题，全部围绕「信息」。

  按规则「每 3 个失败配 1 个复盘」：本卡通常覆盖一批失败，
  而不是单次失败。三次里重复出现的那条缺失信息，优先写。

  在用户同意以后，应当创建本任务的调研子任务，为描述的信息进行研究查询。
  并创建一个兄弟节点，任务模板为“阻碍”。在解决未知之前不应该继续任务。

derive:
  - label: 开调研
    description: 缺的那条信息还没查，先开一张调研卡
    template: research
  - label: 记阻碍
    description: 未知没解决之前不能继续，先把挡路的事记下来
    template: blocker

sections:
  needed:
    label: 为了完成任务我需要知道什么
    hint: |
      需要一个提交后不可交互组件，展示内容。
      列出任务成功所依赖的已知信息 —— 是「要做成这件事我得先知道哪些事」，
      不是「我想查清楚哪些事」。
    default:
      $type: markdown

  missing:
    label: 我失败是因为不知道什么
    hint: |
      需要一个提交后不可交互组件，展示内容。
      指出失败的直接原因是缺了上面哪一条（或多条）。写「缺哪条信息」，不写「发生了什么」。
    default:
      $type: markdown

  next:
    label: 我为什么相信下一次可能成功；或者，我如何知道我要知道的信息
    hint: |
      需要一个提交后不可交互组件，展示内容。二选一，写其中一个：
      前者：说清凭什么相信下一次可能成功（如果穷举是唯一途径并且已经排查诸多可能性）；
      后者：说清要怎么才能拿到第 2 章缺的那些信息。
      自己写明选的是哪一个。
    default:
      $type: markdown
