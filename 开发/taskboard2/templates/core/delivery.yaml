name: delivery
displayName: 交付
kind: record
domain: 核心
codePrefix: L

usage: |
  工作任务需要一个交付类型的子任务对工作结果进行汇报，才能将工作通过。
  应该仅作为工作的子任务使用。

description: |
  这张卡是「工作的完成记录」。它不判断好坏，只记录交付了什么。
  本卡交付后无法动作。用户会过目并进行评审。通过后可以将工作设置为成功。
  即工作必须由用户验收后才能成功。

derive: []

sections:
  what:
    label: 交付了什么
    hint: |
      需要一个提交后不可交互组件，展示内容。
      内容里描述你对工作做的实际动作。

  where:
    label: 在哪里
    hint: |
      需要一个提交后不可交互组件，展示内容。
      内容里描述你的工作哪里可以查阅。
      如果是调研汇报类并且没有留下实体文件，此处写证据出处。

  howToLook:
    label: 怎么查看 / 怎么使用
    hint: |
      需要一个提交后不可交互组件，展示内容。
      内容里描述这个实体结果如何使用或验证是否完成了工作。
