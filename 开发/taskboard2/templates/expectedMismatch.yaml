# ═══════════════════════════════════════════════════════════
#  模板配置 —— 预期不符
#  形状草稿，本地随你改。
# ═══════════════════════════════════════════════════════════

# ── 标识 ──
name: expectedMismatch
#   必填。稳定英文标识。永不变、不复用。③ 只校验唯一性。

displayName: 预期不符
#   必填。显示名。中文，给人看。
#   用户侧说法，不是「反馈 bug」—— 反馈 bug 是已定性，预期不符是研究。

# ── 归属 ──
kind: record
#   必填。分类。写英文。代码里有行为，天然有英文；显示名由代码另外提供。
#   范围是分类里注册过的分类。

domain: 代码
#   必填。领域。单选。原型阶段先写中文（领域纯展示，不产生行为，不需要英文）。

codePrefix: E
#   必填字段，允许零长字符串 ''。
#   编号 = 分类段（③ 从分类定义取，配置不写）+ 本模板段。

# ── 两段描述：纯文本，不产生行为 ──
usage: |
  反馈bug。不过在查明之前不能确认真的是bug。
#   ↑ 列表里那行小字，常驻显示。只一行。

description: |
  先判断性质，再决定下一步；判断不了就先开调研，不要下结论：
  - 确实是缺陷：选择一个合适的工作模板创建子任务去修。
  - 非目标（本项目不做这件事）：留档，回复用户说明。
  - 用户理解错了：回复解释，必要时补一张记录卡存档。
  - 语义如此（设计本来就是这样）：回复解释，不改代码。
  - 属于二期项目：留档，不排期。
  - 多个性质并存：拆成复数个子任务，各自处理。
#   ↑ 点模板才展开的完整说明。含"用完下一步看什么"。

# ── 派生 ──
#   ⚠ 这是**数组**（每项一个按钮），不是 object。
#     因为派生按钮天然是「一串并列的入口」，没有需要用 key 去查的语义，
#     也不存在"取某个特定按钮"的操作 —— 有顺序就够。
#
#   ⚠ 这是「这张卡建好之后，能从它身上派生出什么」—— 不是它自己的变体。
#     例如：一张「预期不符」卡，判断不了性质时，派生出「调研」去查。
#     所以这里的 template 一般**不是自己**。
#
#   一个「派生」= 一个快捷按钮：点了就开新建面板，并预填若干字段。
#   效果与「在外面点新建，再手动选父任务和模板」完全一样。
#   **它没有行为** —— 预填之后用户可以改模板、删关系，改了什么都不会发生。
#   对 AI 没有半点帮助，纯粹是方便用户操作。
#
#   template 可以指向普通模板，也可以指向预设模板（预设模板会连章节内容一起带进来）。
#   同一个目标，普通模板与它的预设模板**可以并排各摆一个按钮**：
#   只要那个普通模板在"有预设"的情况下仍然高频，就仍然值得摆。
#   因为这里的语义只是快捷创建 —— 摆几个按钮，纯粹看便利性。
#
#   ⚠ 变量只有三个，且前两个指"当前卡"、第三个指"新建卡"：
#       {{ title }}   当前卡（触发 derive 的那张卡）的标题
#       {{ parent }}  当前卡的编号
#       {{ kind }}    新建出来的卡的分类（由目标模板决定）
#     模板内部的东西（章节 payload）**不受变量影响** —— 变量到任务卡为止。
#     （曾有 {{ domain }}，因 domain 是模板属性、卡上不存，已删。）
derive:
  - label: 开调研确认 # 按钮文字
    description: 判断不了这是缺陷还是误解，先开一张调研卡把情况查清楚 # 按钮悬浮描述
    template: "" # 指向调研类普通模板的 name；这里留空待定
    title: "{{ parent }} 的调研" # 可选：卡的标题，可用变量
    relations: # 可选：预填的 relations
      parent: "{{ parent }}" # 父任务指向当前卡
      links:
        - label: dependsOn # 关系类型写英文标识（显示名由 ④ 的词汇表提供）
          to: "{{ parent }}"

  - label: 开调研（快捷） # 同一个目标的预设版本，内容已填好，一键创建
    description: 同上，但调研的方向和选项已经填好，点开就能用
    template: "" # 指向调研类预设模板的 name；这里留空待定
    title: "{{ parent }} 的调研"
    relations:
      parent: "{{ parent }}"
      links:
        - label: dependsOn # 关系类型写英文标识
          to: "{{ parent }}"

# ── 章节 ──
#   object。key = 章节名（模板内唯一），value = 该章节的声明。
#   预设模板的 key 必须与这里一致，但 value 放的是填好的 action payload。
sections:
  summary:
    label: 一句话描述
    hint: |
      需要一个文本输入框。

  expect:
    label: 希望发生什么
    hint: |
      需要一个文本框，可能要写多行。

  expectSource:
    label: 为什么这么想
    hint: |
      需要一个文本框，或者单选/复选框，或其他适合的组件。
      通常可以概括为这些情况：
      - 望文生义（从语义说，这个东西在这里长这样就应该这样做才有道理）
      - 同类产品（具有类似功能的项目实现，具有这样的行为）
      - 附随文档（这个项目自己表示会这样说，包括更新说明和readme）
      - 社区传阅（有wiki，或视频平台，论坛，有记录的表明很多人这样认为）
      - 历史惯性（曾经是这样的行为，更新没说会变，但变了）
      - 官方暗示（开发者访谈，笔记，博客。或是维护者在社区宣称，支持，某个功能在现版本发布）

  actual:
    label: 实际发生什么
    hint: |
      需要一个文本框，可能要写多行。

  locate:
    label: 怎么定位
    hint: |
      需要一个文本框，需要引导填写以下内容之一：出现频率，最小复现，问题仓库。
      如果以后有选项型 action，这里可以换成选项。
    accepts: [text]
    #   可省。写了 = 限定候选范围。

  note:
    label: 补充说明
    hint: |
      通常需要一个文本框。如果组件可以包含提示，那么提示里面应该表明，在此章节写猜测成因。
