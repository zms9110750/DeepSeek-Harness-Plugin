$type: text

summary: 自由文本。创建时填灰字提示，进行时填内容

schema:
  type: object
  required: [$type]
  properties:
    $type:
      const: text
    value:
      type: string
    placeholder:
      type: string
  additionalProperties: true

# ── 渲染器 ──
# 每态一个函数，不是用字符串描述「要什么」。
# 名字对应代码里导出的函数；参数与返回值见 docs/渲染器.md。
renderer:
  create: textCreate
  active: textActive
  ended: textEnded
  plain: textPlain
