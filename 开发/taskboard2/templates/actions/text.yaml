# ═══════════════════════════════════════════════════════════
#  Action —— text
#  一个 action = 一份 JSON 架构 + 一个渲染器。
#  它只负责「接受什么样的参数」和「把合法参数画出来」。
#  它不知道卡片、不知道模板、不知道草稿还是采纳。
# ═══════════════════════════════════════════════════════════

$type: text

summary: 自由文本输入框，单行或多行
#   给 AI 看的一句话：这个 action 能提供什么输入能力。
#   模板的 hint 说「我要什么」，这里说「我能给什么」，AI 拿两边配对来挑。

# ── 架构 ──
schema:
  type: object
  required: [$type]
  properties:
    $type:
      const: text
    value:
      type: string # 答案。可省（= 空）。创建时可直接给初始值
    placeholder:
      type: string # 灰字。可省
    row:
      type: integer
      minimum: 1
      default: 3 # 行数。1 = 单行，>1 = 多行
  additionalProperties: true # 用户 13:18 裁：未知字段穿过（旧卡兼容）

# ── 渲染 ──
render:
  edit: |
    可编辑：按 row 决定 <input> 还是 <textarea>。
    用户改动 → onChange(下一份完整 payload)。
    ⚠ 只产出「完整 payload」，不产出「值变了」。这是唯一通道。

  view: |
    只读：纯文本，保留换行。
    不渲染 markdown —— action 里所有字符串都是纯文本。

# ⚠ 没有 readonly 字段。
#   只读展示用 markdown action，不是给 text 加开关。
