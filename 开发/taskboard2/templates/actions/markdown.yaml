# ═══════════════════════════════════════════════════════════
#  Action —— markdown
#  整条链上唯一会渲染 markdown 的地方。
# ═══════════════════════════════════════════════════════════

$type: markdown

summary: 只读的一段富文本，会渲染 markdown

# ── 架构 ──
schema:
  type: object
  required: [$type]
  properties:
    $type:
      const: markdown
    value:
      type: string # 要渲染的 md 源码
    placeholder:
      type: string # 空值时的灰字
  additionalProperties: true

# ── 渲染 ──
render:
  edit: |
    可编辑：源码编辑框 + 下方实时预览。
    编辑的是源码，不是所见即所得。

  view: |
    只读：渲染成富文本。

# ⚠ 这是全项目唯一渲染 markdown 的地方。
#   其它文本（action 的 value / placeholder / options 里的 label 与 description）
#   全部按纯文本显示，不解析 markdown。
