name: expectedMismatch
displayName: 预期不符
kind: goal
domain: 代码
codePrefix: E

usage: |
  反馈bug。不过在查明之前不能确认真的是bug。

description: |
  本卡是目标类。建出来是草稿，用户采纳后才进入计算。
  采纳后状态由子任务推导：没有子任务或全未开始为「提交」，有开始的为「处理中」。
  本卡不记录结果。取消只能用户点。

  先判断性质，再决定下一步；判断不了就先开调研，不要下结论：
  - 确实是缺陷：选择一个合适的工作模板创建子任务去修。
  - 非目标（本项目不做这件事）：留档，回复用户说明。
  - 用户理解错了：回复解释，必要时补一张记录卡存档。
  - 语义如此（设计本来就是这样）：回复解释，不改代码。
  - 属于二期项目：留档，不排期。
  - 多个性质并存：拆成复数个子任务，各自处理。

derive:
  - label: 开调研确认
    description: 判断不了这是缺陷还是误解，先开一张调研卡把情况查清楚
    template: research
  - label: 开编写代码
    description: 确认是缺陷，开一张工作卡去修
    template: writeCode
  - label: 留档
    description: 不是缺陷但不打算改，存一份说明
    template: archive

sections:
  summary:
    label: 一句话描述
    hint: |
      需要一个文本框。
    default:
      $type: text
      placeholder: 一句话说清哪里不对

  expect:
    label: 希望发生什么
    hint: |
      需要一个文本框，可能要写多行。
    default:
      $type: text
      placeholder: 你预期会怎样

  expectSource:
    label: 为什么这么想
    hint: |
      从组件库里找具有单选能力的组件，列出几种常见的预期来源。
    default:
      $type: ask
      items:
        - question: 这个预期的依据
          multi_select: false
          options:
            - label: 望文生义
              description: 从语义说，这个东西在这里长这样就应该这样做才有道理
            - label: 同类产品
              description: 具有类似功能的项目实现，具有这样的行为
            - label: 附随文档
              description: 这个项目自己表示会这样说，包括更新说明和readme
            - label: 社区传阅
              description: 有wiki，或视频平台，论坛，有记录的表明很多人这样认为
            - label: 历史惯性
              description: 曾经是这样的行为，更新没说会变，但变了
            - label: 官方暗示
              description: 开发者访谈，笔记，博客。或是维护者在社区宣称，支持，某个功能在现版本发布

  actual:
    label: 实际发生什么
    hint: |
      需要一个文本框，可能要写多行。
    default:
      $type: text
      placeholder: 实际看到什么

  locate:
    label: 怎么定位
    hint: |
      需要一个文本框，需要引导填写以下内容之一：出现频率，最小复现，问题仓库。
    default:
      $type: text
      placeholder: 出现频率 / 最小复现 / 问题仓库

  note:
    label: 补充说明
    hint: |
      通常需要一个文本框。如果组件可以包含提示，那么提示里面应该表明，在此章节写猜测成因。
    default:
      $type: text
      placeholder: 猜测的成因
