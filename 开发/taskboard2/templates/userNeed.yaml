# ═══════════════════════════════════════════════════════════
#  模板配置 —— 用户任务
#  形状草稿，本地随你改。
# ═══════════════════════════════════════════════════════════

# ── 标识 ──
name: userNeed
displayName: 用户任务
kind: goal # 必填。分类 id，英文。范围是分类里注册过的分类。
domain: 核心 #此处应该写英文。然后在一个其他的地方应该描写领域的显示名。但原型开发中先写中文。不区分显示名。
codePrefix: U # 必填字段，但允许零长字符串 ''。

usage: |
  用户为ai发布任务。此处只有一个不限制格式的章节。可以将需求一股脑写下来，让ai进行分配。

  # 确定了，此处应该写创建模板时，介绍模板的内容。

description: |
  ai应该根据用户任务进行语义解析，分析用户意图。通常的，应该建复数个其他任务为本任务的子任务
  - 用户描述了一个没有确切结束的工作：选择一个合适的目标模板创建任务。
  - 用户描述了一个需要完成的工作：选择一个合适的工作模板创建任务
  - 用户描述了一个需要你遵守的规则：选择一个合适的记录模板创建任务。并且之后的工作都连接这个记录，添加“约束”或“参考”关系
  - 用户进行了提问：通常，应该先开一个“调研”模板的子任务，然后再为调研任务进行回复，而不是直接创建记录。除非无可调研，例如“你怎么看”这类问题。
  - 通常不会出现设计作为子任务，除非在有决策之前连“目标”都无法创建。

  # 此处写，任务卡已经创建好了，点任务卡看见的内容，也就是这是什么和下一步做什么。

#   ↑ 点模板才展开的完整说明。

# ── 派生 ──
#   ⚠ 这是**数组**（每项一个按钮），不是 object。
#     派生按钮天然是「一串并列的入口」，没有需要用 key 去查的语义。
#
#   一个「派生」= 一个快捷按钮：点了就开新建面板，并预填若干字段。
#   效果与「在外面点新建，再手动选父任务和模板」完全一样。
#   **它没有行为** —— 预填之后用户可以改模板、删关系，改了什么都不会发生。
#   对 AI 没有半点帮助，纯粹是方便用户操作。
#
#   template 可以指向普通模板，也可以指向预设模板。
#
#   ⚠ 变量只有三个，且前两个指"当前卡"、第三个指"新建卡"：
#       {{ title }}   当前卡（触发 derive 的那张卡）的标题
#       {{ parent }}  当前卡的编号
#       {{ kind }}    新建出来的卡的分类（由目标模板决定）
#     模板内部的东西（章节 payload）**不受变量影响** —— 变量到任务卡为止。
#     （曾有 {{ domain }}，因 domain 是模板属性、卡上不存，已删。）
derive:
  - label: 拆成设计 # 需求不清楚时，先开一张设计卡把它问明白
    description: 需求不清楚时，先开一张设计卡把它问明白
    template: "" # 填设计类某个模板的 name；这里留空待定
    title: "{{ parent }} 的设计" # 可选：卡的标题，可用变量
    relations: # 可选：预填的 relations
      parent: "{{ parent }}"
      links: []

  - label: 拆成工作 # 需求已经明确，直接开一张工作卡去做
    description: 需求已经明确，直接开一张工作卡去做
    template: "" # 填工作类某个模板的 name；这里留空待定
    title: "{{ parent }} 的实现"
    relations:
      parent: "{{ parent }}"
      links: []

# ── 章节 ──
#   object。key = 章节名（模板内唯一），value = 该章节的声明。
#   预设模板的 key 必须与这里一致，但 value 放的是填好的 action payload。
#  hint = 这一章需要什么样的输入能力（给 AI 在「用模板选 action」阶段看）
#         不是「用户该写什么」，也不是输入框 placeholder。
#         输入框里的样子由 action 自己决定。
#  accepts = 可省。省略 = 任何已注册 action 都行（含外来注册的）。
#            写了 = 限定候选范围。
sections:
  core-userNeed: #模板内唯一
    label: 我想要什么 #显示名。会作为 <h2>显示。不会渲染md格式。
    hint: |
      需要一个能自由书写的文本框。用户可能写一句，也可能写一段。
