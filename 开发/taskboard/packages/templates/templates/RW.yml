name: RW · 交付
default_kind: record
behavior: write
description: 交出去了什么；用户在上面点成功就是验收
domain: core
framed: true
dispatch: [goal, design, record, work]
hints:
  create: |
    这一条是**给人看的交付单**，不是工作日志。

    工作卡是 AI 的草稿本，用户不读。所以做完之后要单独写这一条：
    我交付了什么、在哪、你怎么用。

    写不出来「用户拿它能做什么」，说明还没做完 —— 回去继续做，
    别在这里写"已完成"。

  reject: |
    被拒说明交付的东西还不是用户要的。不要重写这一条，
    先去看用户拒的是哪一部分，然后回到工作卡继续做。

    重写交付之前先确认：产物本身改了没有？没改只是改了说明，
    那用户还是会拒。

  fail: |
    交付不会失败 —— 做不出来就是工作失败，不是交付失败。

body:
  - type: markdown
    attributes:
      value: |
        这一条的价值全在「用户能拿走用什么」。
        写完自己读一遍：如果我是用户，读完知道怎么用吗？

  - type: textarea
    id: what
    attributes:
      label: 交付了什么
      description: |
        写**是什么东西**，不是"我做了什么"。

        好：
          core/index.js 里的 derivedStatus 函数
          一个 mcp 服务，地址 http://127.0.0.1:52311
          一个 cli 程序，入口 bin/taskboard
          一份 20 页的接口说明文档

        坏：
          完成了状态推导的重构
          做完了

        判断标准：这个东西**能不能被单独拿走用**。
    validations:
      required: true

  - type: textarea
    id: where
    attributes:
      label: 在哪
      description: |
        路径 / 链接 / 端口 / 命令。让人能**直接摸到**。

        代码给文件路径 + 函数名；程序给端口或入口；
        文档给路径；结论给原话引用。

        写"在仓库里"等于没写。
    validations:
      required: true

  - type: textarea
    id: how
    attributes:
      label: 怎么用
    attributes_note: 交付物类型不同，这一步差别很大
    description: |
      调用它 / 运行它 / 打开它，具体怎么做。

      mcp 服务：   在哪个配置里加哪一行，然后能调什么
      cli 程序：   敲什么命令，参数是什么
      函数：       怎么引入，签名是什么
      文档：       按什么顺序读

      这一栏是用户第一次用它时的全部依据。写不出就是没做完。
    validations:
      required: true

  - type: [ask, textarea]
    id: for
    attributes:
      label: 因为什么交付
      max_picks: 1
      options:
        - 工作：某条工作的产物
        - 目标：这个目标本身要交的东西
      description: |
        写清由头：这个交付是为了结掉哪件事。

        为什么要有：一条交付挂在工作 A 下面，但用户看到时可能在目标层。
        没有由头，他不知道自己为什么在看这个。

        选了之后在正文里写出那张卡的单号。
    validations:
      required: true

  - type: textarea
    id: verify
    attributes:
      label: 你怎么验过
      description: |
        给出**可执行**的验证方式，不是"看一下就行"。

        跑什么命令、看到什么输出算对
        点哪里、看到什么算对
        读哪一段、判断标准是什么

        写不出验证方式，说明这份交付还不能验收。
    validations:
      required: true

  - type: textarea
    id: not
    attributes:
      label: 没做什么
    attributes_note: 和「做了什么」同样重要
    description: |
      明确划出这次**没有**覆盖的范围。

      这一栏防的是：用户以为你做了，结果你没做，而验收时没发现。
      写"无"之前想一下：真的什么都没想到吗？

  - type: textarea
    id: other
    attributes:
      label: 其他
      description: |
        给下一个接手的人留话：哪里最容易改坏、哪段代码看着奇怪但有原因。

        这套框架装不下的东西写这里。如果这里反复被填，说明模板缺了一节 ——
        回头改模板，别让它一直兜底。
