name: RF · 复盘
default_kind: record
behavior: write
description: 一件事结束后的回顾：根因、教训、下次怎么避
domain: core
framed: true
dispatch: [goal, design, record, work]
hints:
  create: |
    复盘不是流水账。只写"下次能用的"东西。
    如果这次没出问题，不需要复盘。

    最关键的：**不要穷举**。
    "我试了 A、B、C 都不行"是流水账，不是复盘。
    复盘只回答：如果当初知道哪一件事，结果就会不同？
  fail: |
    复盘是对失败的复盘，它本身不会失败。
    但复盘不等于流水账：不要罗列做过的事，只写一个根因。

body:
  - type: textarea
    id: outcome
    attributes:
      label: 实际结果
      description: |
        一句话：成了还是没成。
        没成就直接说，不要包装成"部分达成"。
    validations:
      required: true
  - type: textarea
    id: root
    attributes:
      label: 根因
      description: |
        **一个根因。** 如果你写下三条，说明还没找到那个真的。
        判据：如果当初知道这一条，结果会不同吗？答"会"才是根因。
    validations:
      required: true
  - type: textarea
    id: lesson
    attributes:
      label: 下次怎么避
      description: |
        写成可执行的动作，不要写成感想。
        "要更小心"不是教训；"改代码前先跑一遍测试"才是。
    validations:
      required: true
  - type: textarea
    id: apply
    attributes:
      label: 这条教训该改哪里
      description: |
        指到具体的东西：某个文件、某条规则、某个模板。
        指不出来的教训会立刻忘掉。
  - type: textarea
    id: deliver
    attributes:
      label: 交付
      description: |
        这一条**产出了什么**。记录的价值全在这里：写出来的东西本身，不是过程。

        写清三样：
          · 产物在哪（路径 / 链接 / 结论一句话）
          · 别人拿它做什么（下一步、判断依据、还是照做）
          · 它**过时了怎么知道**（改了什么之后这条就不准了）

        「我把事情做完了」不是交付。交付是一个**别人能拿走用的东西**。
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: 其他
      description: |
        多个根因并存时先修哪个，以及这条教训要不要升级成规则 / 模板改动。

        这套框架装不下的东西写这里。如果这里反复被填，说明模板缺了一节 ——
        回头改模板，别让它一直兜底。
