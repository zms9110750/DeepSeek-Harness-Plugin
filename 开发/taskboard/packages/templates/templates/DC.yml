name: DC · 决策
default_kind: design
behavior: decide
description: 不知道怎么做；要讨论、甚至要先调研，弄明白再定
domain: core
framed: true
dispatch: [goal, design, record, work]
produces: []
hints:
  create: |
    ## 决策是开放问题

    这一条出现，是因为**还不知道该怎么做**。

    所以不要急着给方案 —— 你可能连问题都还没摸清。
    三种走法，按情况选：

      已经想清了几条互斥的路   → 列选项，让用户拍板
      知道有路但不知道哪条对   → 先派调研（WR），查完回来再定
      连有哪些路都不知道       → 先讨论，可能搁置，走别的路

    **列不出选项不是失败，是常态。** 硬凑 2-4 个假选项比不给选项更糟。

    ## 搁置是合法的结局

    你说过：后者是大方向的，极大可能搁置走别的路。
    弄明白了再回来决定。

    所以 `how_to_know` 这一章比选项重要 —— 它说的是
    "怎么才能知道"，而不是"选哪个"。

  reject: |
    决策不会失败，只会被拒。被拒时不要重新问一遍，先把拒绝理由记下来，
    再决定是换个问法还是转成调研。

  fail: |
    决策几乎不会失败。
    如果连"怎么才能知道"都写不出来，说明这条不该是决策，是一条调研 —— 转出去。

body:
  - type: textarea
    id: question
    attributes:
      label: 要定什么
      description: |
        一句话说清这个开放问题。

        如果这句话里有"和"字，说明是两个决策，拆开分别问。

        注意它和「提问」的区别：
          提问    已经知道有哪几个答案，就是让用户点一下
          决策    还不知道该怎么做，要先弄明白
    validations:
      required: true

  - type: textarea
    id: unknown
    attributes:
      label: 我还不知道什么
      description: |
        **这一章是开放问题的核心。**

        列出现在还不知道的东西 —— 正是它们让这件事还是个问题。

        好：
          不知道现有的导出链路能不能加一列而不破坏下游
          不知道用户是想要"能对账"还是"能看趋势"

        坏：
          不确定（太笼统）
          没有（那这就不是开放问题，是问答题）

        如果某个未知项会直接改变答案 → 先派一条调研，不要硬定。
    validations:
      required: true

  - type: [ask, textarea]
    id: how_to_know
    attributes:
      label: 怎么才能知道
      max_picks: 1
      options:
        - 已经想清了，直接定：下面列选项
        - 要派调研：先查清某件事
        - 要和用户讨论：说说各自的想法
        - 先搁置：现在不该定这件事
      description: |
        这一栏决定这条卡接下来怎么走。

        选「要派调研」就在正文里写清派什么、查什么。
        选「先搁置」就写清为什么现在不该定 —— 搁置不是逃避，是一个决定。

        为什么这一栏比选项重要：
        决策的价值不在"选了哪个"，而在"怎么才算弄明白了"。
    validations:
      required: true

  - type: [ask, textarea]
    id: options
    attributes:
      label: 选项（想清了才列）
      max_picks: 1
      options:
        - 选项 A：写做什么 + 代价
        - 选项 B：写做什么 + 代价
      description: |
        **选填。** 只有在"已经想清了几条互斥的路"时才填。

        每条写清：做什么、代价是什么、放弃了什么、什么情况下它是错的。

        不要写"取决于"—— 那是还没想清楚。

        列不出来就留空，用上面那一栏说明"怎么才能知道"。
        列不出 2 个真正互斥的选项还硬凑，比不列更糟。

  - type: textarea
    id: recommend
    attributes:
      label: 我的倾向（有就给）
      description: |
        有倾向就写"如果是我，我选 X，因为 Y"。
        真没有就写"无倾向，需要先弄清上面那些未知项"。

        **不硬给。** 不知道的时候说不知道，比编一个理由强。
