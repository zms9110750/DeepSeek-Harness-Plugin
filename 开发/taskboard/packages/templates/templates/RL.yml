name: RL · 留档
default_kind: record
behavior: write
description: 踩过的坑记一笔；写出来等人过目，不是给人解决
domain: core
framed: false
dispatch: [goal, design, record, work]
hints:
  create: |
    ## 你和 RB 阻碍的区别

    | | RB 阻碍 | RL 留档 |
    | --- | --- | --- |
    | 什么时候用 | 我现在决定不了，要人拍板 | 这事已经过去，记一笔 |
    | 对父工作的影响 | 让它变「需要授权」 | 无 |
    | 谁看 | 要人裁决 | 以后踩坑的人 |

    混用会出事：把"以后再说"的坑派成阻碍，会让好好的工作停下来。

    ## 留档不一定对

    AI 写完的留档不一定对 —— 它可能记错原因、归错类。
    所以初始状态是「需要授权」：用户要看一眼留了什么才作数。

  reject: |
    被拒说明这条记的东西不对或者不必要。
    不要原地改，先想清楚：这个坑真的会有人再踩吗？

body:
  - type: textarea
    id: what
    attributes:
      label: 踩到了什么
      description: |
        一句话说清现象。

        不要写"遇到问题"，要写"执行 X 时报 Y"。
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 为什么
      description: |
        能说清就说清。说不清就写"没查清，推测是 X" ——
        **别猜成确定的语气**，后来的人会当真。

  - type: [ask, textarea]
    id: disposition
    attributes:
      label: 这条现在什么状态
      max_picks: 1
      options:
        - 已修：根因消掉了
        - 绕过了：能用，根子还在
        - 没修：记着，以后再说
        - 不是缺陷：意图如此，是乌龙
      description: |
        **结题时填。** 「已修 / 绕过了 / 没修」是事后才知道的。

        这一栏是留档的核心：**它允许"不修"**。

        修好了就写「已修」；绕过但根子还在就写「绕过了」；
        暂时不管写「没修」；查完发现本来就这样写「不是缺陷」。

        为什么要有：绕过也是解决问题的一种，但根子还在。
        如果不写清，下一个踩到的人会以为这里没毛病。

  - type: textarea
    id: avoid
    attributes:
      label: 下次怎么避
      description: |
        可执行的：改哪一行、别用哪个 API、检查哪一步。
        写"注意一下"等于没写。
    validations:
      required: true

  - type: textarea
    id: other
    attributes:
      label: 其他
      description: |
        这套框架装不下的东西写这里。
