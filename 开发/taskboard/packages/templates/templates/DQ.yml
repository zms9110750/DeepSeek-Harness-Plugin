name: DQ · 提问
default_kind: design
behavior: answer
description: 给用户几个选项让他点；答了就完
domain: core
framed: true
dispatch: [goal, design, record, work]
hints:
  create: |
    ## 提问要给选项

    提问的价值是**让用户少打字**。所以第一选择永远是给选项，让他点一下。

    只在你确实列不出候选时才退化成自由回答 —— 那时候它其实更接近"决策"，
    先想清楚到底是哪一种。

    ## 能自己查到的不问

    问之前先想：这个我能不能调研出来？
    能 → 派调研；不能 → 才问。

  fail: |
    用户没答就是没答，不要重复问同一个问题。
    换个问法之前先想清：是不是问题本身问错了。

    **不要罗列**所有想问的 —— 一个问号一条提问。
    列一串等于把判断推回给用户。真有好几个问题，就派几条独立的提问。

body:
  - type: [ask, textarea]
    id: options
    attributes:
      label: 给用户选的选项
      max_picks: 1
      options:
        - 选项 A
        - 选项 B
      description: |
        **这是提问的主体。** 把候选答案列出来，用户点一个就答完了。

        列的时候注意：
          · 选项要真的能选（不要"看情况"这种）
          · 2-5 个最好，多了用户也会随便点
          · 实在列不出来才留空，让他自由回答

        自填框永远在 —— 用户想答选项之外的，直接写。
    validations:
      required: true

  - type: textarea
    id: ask
    attributes:
      label: 问的是什么
      description: |
        一句话说清这个问题。如果里面有两个问号，拆成两条分别问。

        这句话要和上面的选项对得上 —— 用户是照着它选。
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 为什么要问
      description: |
        不知道这个会怎样？写清"没有这个信息，我只能做 X 或 Y 的假设"。

        写不出就用默认假设往下做，别问。
    validations:
      required: true

  - type: textarea
    id: guess
    attributes:
      label: 我倾向哪个
      description: |
        选一个，写清为什么。用户看到你的倾向，判断会快很多。

        真没有倾向就写"无倾向"，别硬编一个理由。
    validations:
      required: true

  - type: textarea
    id: other
    attributes:
      label: 其他
      description: |
        可能问错人了、或者这个问题本来就有多个答案 —— 那它就不是提问，是决策。

        这套框架装不下的东西写这里。如果这里反复被填，说明模板缺了一节 ——
        回头改模板，别让它一直兜底。
