name: RB · 阻碍
default_kind: record
behavior: block
description: 我决定不了，要人拍板；父工作会变「需要授权」，停止占位
domain: core
framed: true
dispatch: [goal, design, record, work]
hints:
  create: |
    ## 阻碍 = "我无权决定"，不是"物理上过不去"

    这些**全都是阻碍**，因为它们都该用户拍板：

      我算出来代价大   → 但我可能算错（O(n²) 可能是唯一解）
      我觉得方案烂     → 但用户可能接受
      用户说别做了     → 但我不能替用户关掉（取消是完成态，用户决定的）
      缺权限 / 缺信息  → 要人给，或者要我去查

    反过来说：**如果我能自己决定，就不该派阻碍。**

    ## 你不写解决方式

    这一条的作用是把决定权交给用户，不是给自己出主意。

    不写"我打算怎么解决"——因为：
      1. 你可能根本不知道原因（那就先派一条调研）
      2. 你可能判断错了（代价大 ≠ 真的大）

    解决方式只有用户说了"要解决"之后，才在子事项里写。

    ## 只写真的需要人看的事

    这一条一出现，父工作立刻变「需要授权」，停止占位。
    有点麻烦就派阻碍，会把好好的工作打断。

  blocked: |
    父工作停下之后，三种走法（都要用户点头）：

      · 派一个调研去查清（工作）—— 不知道原因时用这个
      · 派一个决策让用户选（设计）—— 知道有几条路，让用户挑
      · 用户直接说"继续" —— 用户判断这事不用管

    不要在阻碍里长篇分析 —— 分析是调研的事。

  fail: |
    阻碍不会失败。它只会被「解除」或者被「放弃」。

    解除 = 用户说继续，或者该补的东西补上了
    放弃 = 用户说这事不做了

    放弃时写清：放弃了什么、绕过去要付什么代价。

body:
  - type: markdown
    attributes:
      value: |
        这一条的作用是**让工作停下来等人**，不是记录困难。
        它一存在，父工作就不占会话位，等你拍板。

  - type: textarea
    id: where
    attributes:
      label: 卡在哪一步
      description: |
        一句话，指到具体的步骤。

        "做不下去了"不算；
        "执行第 3 步时迁移脚本报外键冲突"才算。
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: 已经试过什么
      description: |
        **这一栏是为了让别人不重复你的路。**

        不写它，接手的人第一句话一定是"你试过重启吗"。

        一条一行，写清"试了什么 → 结果"：

          重装依赖 → 无效
          换 node 18 → 无效
          查了 RB-03，情况不同（那条是权限，这条是网络）

        只写**最后排除的那几条**，不要罗列全部。
        全列出来是流水账，不是记录。

  - type: textarea
    id: consequence
    attributes:
      label: 不解决会怎么样
      description: |
        **这一章比"为什么过不去"重要。**

        因为你可能完全不知道原因（那就该先派调研）。
        但你一定知道不解决的后果。

        写什么：
          · 谁被挡住
          · 最差能绕到什么程度
          · 绕过去的代价

        好：
          Safari 上白屏，前端所有功能不可用
          能绕过，但每次发布都要手工改一遍配置
          这条不过 Lint，后续 12 个文件都改不了

        坏：
          做不下去了
          有问题
    validations:
      required: true

  - type: [ask, textarea]
    id: bypass
    attributes:
      label: 能不能绕
      max_picks: 1
      options:
        - 能绕：写绕法，以及绕过去欠下什么
        - 不能绕：写缺的到底是什么
      description: |
        **先判断能不能绕，只写那一半。** 两半都写，等于没判断。

        ▸ 能绕 → 写绕法，以及绕过去会欠下什么（技术债？绕过的是入口还是根因？）
          能绕还派阻碍，会把好事打断；绕法写给下一个接手的人。

        ▸ 不能绕 → 写"不能绕"，再补一句缺的到底是什么：权限、信息、还是外部依赖。
          缺什么决定谁来解 —— 缺权限要用户动，缺信息派调研，缺外部依赖只能等。
          写不出缺什么，说明还没定位到那一步，先派一条调研。
    validations:
      required: true

  - type: [ask, textarea]
    id: reason
    attributes:
      label: 停下来的原因
      max_picks: 1
      options:
        - 需要授权 · 代价过大
        - 需要授权 · 用户转移话题
        - 需要授权 · 方案缺陷过大
        - 需要授权 · 资源被占用
        - 需要授权 · 缺权限
        - 需要授权 · 环境不对
        - 需要信息 · 缺用户信息
        - 需要信息 · 需要先调研
        - 需要信息 · 子任务未回收
      description: |
        从词表里挑一个，再补一句具体说明。

        这九项的共同点是：**我无权自己判断该怎么办。**

          代价过大 / 方案缺陷过大   我判断贵或烂，但可能判断错
          用户转移话题              用户说别做了，但我不能替他关掉
          缺权限 / 环境不对 / 资源被占用   要人动
          缺用户信息 / 需要先调研   要我去查
          子任务未回收              下属还没交回来

        挑不出来，说明你还没想清卡在哪 —— 先别派阻碍。
    validations:
      required: true

  - type: [derive, textarea]
    id: next
    attributes:
      label: 下一步最该试的一件事
      description: |
        **只写一件。** 写多件等于没想清楚优先顺序。
        真要并行试两件，那是两个工作，不是一条阻碍。

        能派就派（derive 优先）：派一条调研去查，或者派一条决策让用户选。
        派不出去才写文字。
    validations:
      required: true

  - type: textarea
    id: other
    attributes:
      label: 其他
      description: |
        阻碍背后其实是两件事（那就拆成两条阻碍），以及"谁有权确认它解除了"。

        这套框架装不下的东西写这里。如果这里反复被填，说明模板缺了一节 ——
        回头改模板，别让它一直兜底。
