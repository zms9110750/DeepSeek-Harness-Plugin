name: RB · 阻碍
default_kind: record
behavior: block
description: 卡住了；父工作会被踢出「处理中」，转入「需要补充」
domain: general
framed: true
dispatch: [goal, design, record, work]
hints:
  create: |
    这一条一出现，父工作立刻停止占位。所以只写"真的过不去"的事，
    不要因为"有点麻烦"就派阻碍——那会把好好的工作打断。

    不要穷举你试过的一切。只写：
      · 卡在哪一步（一句话）
      · 为什么过不去（**一个**原因，不是清单）
      · 下一步最该试的一件事（**一件**，不是清单）
    如果确实不知道下一步 → 派一个调研，别在这条里继续猜。
  blocked: |
    阻碍解除之前，父工作不能继续。解决方式有三种：
      · 派一个调研去查清（工作）
      · 派一个决策让用户选（设计）
      · 直接写清绕法，解除阻碍
    不要在阻碍里长篇分析——分析是调研的事。
  fail: |
    阻碍不会失败。它只会被"解除"或者被"放弃"。
    放弃时写清：放弃了什么、绕过去要付什么代价。

    不要罗列你试过的每一种绕法 —— 那是流水账，只留最后判断的那一条。

body:
  - type: markdown
    attributes:
      value: |
        这一条的作用是**让工作停下来**，不是记录困难。
        它一存在，父工作就不占会话位。
  - type: textarea
    id: where
    attributes:
      label: 卡在哪
      description: |
        一句话，指到具体的步骤。
        "做不下去了"不算，"执行第 3 步时迁移脚本报外键冲突"才算。
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 为什么过不去
      description: |
        **只写一个原因。** 如果你列了三个原因，说明还没找到根因——
        那就先派一个调研。
    validations:
      required: true
  - type: [textarea, derive]
    id: next
    attributes:
      label: 下一步最该试的一件事
      description: |
        **只写一件。** 写多件等于没想清楚优先顺序。
        真要并行试两件，那是两个工作，不是一条阻碍。
    validations:
      required: true
  - type: textarea
    id: bypass
    attributes:
      label: 能不能绕（二选一）
      description: |
        **先判断能不能绕，只写那一半。** 两半都写，等于没判断——绕得过去的事不该算阻碍。

        ▸ 能绕 → 写绕法，以及绕过去会欠下什么（技术债？绕过的是入口还是根因？）
          能绕还派阻碍，会把好事打断；绕法写给下一个接手的人。

        ▸ 不能绕 → 写"不能绕"，再补一句缺的到底是什么：权限、信息、还是外部依赖。
          缺什么决定谁来解 —— 缺权限要用户动，缺信息派调研，缺外部依赖只能等。
          写不出缺什么，说明还没定位到那一步，先派一条调研。
  - type: textarea
    id: reason
    attributes:
      label: 停下来的原因
      description: |
        从词表里挑（见 templates/STOP-REASONS.md），再补一句具体说明：
        · 需要授权：代价过大 / 用户转移话题 / 方案缺陷过大 / 资源被占用 / 缺权限 / 环境不对
        · 需要补充：缺用户信息 / 需要先调研 / 子任务未回收
        挑不出来说明还没想清卡在哪，先别派阻碍。
    validations:
      required: true
  - type: textarea
    id: deliver
    attributes:
      label: 交付
      description: |
        这一条**产出了什么**。记录的价值全在这里：写出来的东西本身，不是过程。

        写清三样：
          · 产物在哪（路径 / 链接 / 结论一句话）
          · 别人拿它做什么（下一步、判断依据、还是照做）
          · 它**过时了怎么知道**（改了什么之后这条就不准了）

        「我把事情做完了」不是交付。交付是一个**别人能拿走用的东西**。
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: 其他
      description: |
        阻碍背后其实是两件事（那就拆成两条阻碍），以及"谁有权确认它解除了"。

        这套框架装不下的东西写这里。如果这里反复被填，说明模板缺了一节 ——
        回头改模板，别让它一直兜底。
