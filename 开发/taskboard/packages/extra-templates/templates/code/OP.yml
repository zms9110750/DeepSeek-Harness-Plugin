name: OP · 项目优化
default_kind: goal
behavior: answer
description: 觉得哪不好；先定优化什么，因为不同方向的完成标准完全不同
domain: code
framed: true
dispatch: [goal, design, record, work]
hints:
  create: |
    ## 先定"优化什么"

    不同优化方向，判断"做完了没有"的标准完全不同：

      性能优化   要有数字（基线 → 目标）
      语义优化   要有新旧对照 + 迁移方案
      可读性     要有"改完之后另一个能看懂"的验证
      扩展性     要有"加一件新事要改几个文件"的对比

    所以第一件事是选定方向。选不出来，说明这不是"优化"，
    而是"我也不知道哪不对" —— 那先派一条调研。

    ## 这一条是目标

    一条优化通常要拆成好几个工作（改这里、改那里、再测一遍）。
    不要指望一张工作卡装下。

  fail: |
    目标不会失败。它只会被「取消」。
    优化做不下去，通常是方向选错了 —— 换个方向重开，别硬推。

body:
  - type: markdown
    attributes:
      value: |
        这一份只写"哪不好、改成什么样"。
        具体怎么改是子事项的事。

  - type: [ask, textarea]
    id: aspect
    attributes:
      label: 要动哪些方向
      max_picks: 99
      options:
        - 性能优化：更快 / 更省内存
        - 语义优化：名字和行为对不上，容易用错
        - 可读性优化：看不懂，改不动
        - 接口界面优化：对外暴露的东西不合理
        - 扩展性优化：加一件事要改很多地方
        - 一致性优化：同一个概念在不同地方叫不同名字
      description: |
        勾出这次要动哪些方向。**可以多选。**

        勾完在下一章钉住"哪一个决定验收"。
        三个方向同时"必须达标"等于没有标准 —— 所以只要一个说了算。

        勾不出来，先派一条调研去查"到底哪不好"。
    validations:
      required: true

  - type: [ask, textarea]
    id: aspect_primary
    attributes:
      label: 哪个方向决定验收
      max_picks: 1
      options:
        - 性能优化
        - 语义优化
        - 可读性优化
        - 接口界面优化
        - 扩展性优化
        - 一致性优化
      description: |
        上面勾了哪些方向，这里钉住**哪一个说了算**。

        判据只看主要的那个：它达标就算做完，其余的不达标可以记下来。
        为什么只要一个：三个方向同时"必须达标"，等于没有标准。

        这个必须是上面勾过的之一。
    validations:
      required: true

  - type: textarea
    id: where
    attributes:
      label: 哪里不好
      description: |
        指到具体的东西：哪个文件、哪一段、哪个接口。

        好：core/index.js 的 setStateInner 有 200 行，改一处要看懂全部
        坏：代码质量不好
    validations:
      required: true

  - type: textarea
    id: baseline
    attributes:
      label: 现在的数字（或现在的样子）
      description: |
        **这一栏是事后能不能证明"真的变好了"的唯一依据。**

        必须在动手**之前**写，因为改完就回不去了。

        按方向写：

          性能      改之前是多少（P95 800ms）、怎么测的、测几遍
          可读性    现在最难读的是哪段、多少行、几个人说过看不懂
          扩展性    现在加一件事要改几个文件（列出来）
          一致性    同一个概念在几个地方叫什么（列出来）
          依赖      现在有几个依赖、总体积多大

        写"感觉慢"不算 —— 没有数字就没法对比，事后也没法验收。

        「项目优化」的价值全在对比上，而对比的前提是基线。
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: 优化到什么程度算完
      description: |
        **必须按 aspect 写，而且要可判断。**

          性能：P95 从 800ms 降到 200ms 以下
          语义：X 改名为 Y，所有调用点更新，旧的 Y 加 deprecation
          可读性：core/index.js 拆成 5 个文件，每个不超过 300 行
          扩展性：加一件新事要改的文件从 7 个降到 2 个

        写"变好一点"等于没写 —— 没人能判断做完没有。
    validations:
      required: true

  - type: textarea
    id: not
    attributes:
      label: 这次不动什么
      description: |
        优化最容易失控：说好改 A，顺手把 B 也改了，结果 A 没改完。

        明确写清这次**不碰**的东西。

  - type: textarea
    id: other
    attributes:
      label: 其他
      description: |
        这套框架装不下的东西写这里。
