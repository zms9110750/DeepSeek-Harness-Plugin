name: DI · 接口界面
default_kind: design
behavior: propose
description: 封装：给使用者看什么；要望文生义，也包括 UX 与行为
domain: code
framed: true
dispatch: [goal, design, record, work]
hints:
  create: |
    ## 这里不写实现

    接口和界面是**外观契约**，不是实现方案。
    写"用 React 的 X 组件"是错的，写"点了之后出现二级菜单"是对的。

    实现方案是「底层实现」的事 —— 两件事分开定。

    ## 界面也是接口

       API  → 暴露给调用方
       界面 → 暴露给最终用户

    共同点：**定了就别随便改**。所以重点是"不变的部分"，不是功能列表。

    ## 危险操作要有行为设计

    "删除"不是画个红色就完了，要写清：
      什么情况下出现
      点了之后发生什么（二次确认？可撤销？）
      撤不撤销得掉

  fail: |
    接口设计被打回时，通常不是写错了，是没问清谁在用。
    先确认调用方，再改。

    被打回时不要重写整份契约，也不要罗列所有改法：
    写清被拒的是哪一条 + 一个原因 + 下一版只改这一条。

body:
  - type: textarea
    id: goal
    attributes:
      label: 这次定哪个入口 / 哪份契约
      description: |
        指到具体的东西：哪个 API、哪个按钮、哪个页面。

        好：任务卡的「删除」入口
        坏：整个界面的交互
    validations:
      required: true

  - type: [ask, textarea]
    id: exposed
    attributes:
      label: 暴露给谁
      max_picks: 99
      options:
        - 最终用户：界面、文案、交互
        - 调用方：函数签名、返回结构、错误码
        - 运维：日志、配置项、监控点
      description: |
        **一个入口可以同时暴露给好几方。**

        比如一个"导出"按钮：
          最终用户看到它
          调用方拿到它返回的文件
          运维关心它失败时记了什么日志

        暴露给谁，决定了哪些东西是"不能随便改的"。
    validations:
      required: true

  - type: textarea
    id: naming
    attributes:
      label: 望文生义：名字与文案
      description: |
        使用者只看名字就能猜到它做什么，才算合格。

        好：`forceDelete`  / 「彻底删除（不可恢复）」
        坏：`del2`     / 「确定」

        这一栏要写清：改了什么名字、为什么这么改、
        有没有旧名字要保留（deprecation）。
    validations:
      required: true

  - type: textarea
    id: contract
    attributes:
      label: 契约
      description: |
        对外承诺什么：输入、输出、边界。

        API：参数类型、返回结构、错误码
        界面：显示什么、能做什么、状态怎么变

        **只写不变的部分。** 会变的东西写进来就是技术债。
    validations:
      required: true

  - type: textarea
    id: nongoal
    attributes:
      label: 明确不承诺什么
      description: |
        **这一栏比"承诺什么"更重要。**

        接口设计失败几乎总是**承诺太多**：实现者被逼着兼容本来没人要的东西。

        写三类：
          · 边界：什么输入不接、什么情况不处理
          · 不支持的用法：别人可能会这么用，但这次不支持
          · 留给以后的事：知道要做，但不在这一版

        好：
          不承诺并发调用时文件的顺序
          不承诺跨时区边界的行为（见 #88）
          超长输入不保证不截断

        坏：
          没有（等于什么都承诺了）

        写不出"不承诺什么"，说明还没想清边界在哪。
    validations:
      required: true

  - type: [ask, textarea]
    id: visible
    attributes:
      label: 什么时候出现
      max_picks: 1
      options:
        - 永远显示
        - 有条件显示：写清什么条件
        - 只在某些角色下显示：写清谁
      description: |
        **单选。** 一个入口不可能"永远显示"又"有条件显示" —— 那是矛盾的。

        选了「有条件」就在正文里写清条件：
        权限不足时隐藏、还是显示但置灰？这两者对用户是完全不同的。
    validations:
      required: true

  - type: [ask, textarea]
    id: risk
    attributes:
      label: 是不是危险操作
      max_picks: 1
      options:
        - 不是：可撤销或可重做
        - 危险：要二级确认
        - 不可逆：要二次确认 + 明确后果
      description: |
        **单选。** 危险程度只有一档，不能同时"危险"又"不危险"。

        三档的差别：

          不是      误点了还能改回来
          危险      弹二级菜单，写清要删什么
          不可逆    二次确认 + 写清删了之后怎么办（能恢复吗、要多久）

        这一栏决定整个交互的分量，别糊过去。
    validations:
      required: true

  - type: [ask, textarea]
    id: states
    attributes:
      label: 要覆盖哪些状态
      max_picks: 99
      options:
        - 空状态：没数据时显示什么
        - 加载中：等待时显示什么
        - 出错：失败时显示什么
        - 部分失败：一部分成功一部分失败时显示什么
      description: |
        **可多选。** 这几件事互相不冲突，一个入口可以同时有这几种状态。

        勾了就要写清：那种状态下，用户看到什么、能做什么。

        「空状态」最容易漏 —— 一个从没显示过数据的列表，
        第一次打开时是一行字还是一张插图，是设计问题，不是实现细节。
    validations:
      required: true

  - type: textarea
    id: errors
    attributes:
      label: 出错时怎么办
      description: |
        写清：什么错对使用者说、什么错只记日志、什么错要重试。

        重点不是错误码列表，是**使用者看到的和实际发生的**之间的映射。
    validations:
      required: true

  - type: textarea
    id: breaking
    attributes:
      label: 以后改它会破坏什么
      description: |
        谁在用它、改坏了谁会疼。

        这一栏是为了让后来的人知道：这条能不能动、动了要通知谁。

  - type: textarea
    id: other
    attributes:
      label: 其他
      description: |
        这套框架装不下的东西写这里。
