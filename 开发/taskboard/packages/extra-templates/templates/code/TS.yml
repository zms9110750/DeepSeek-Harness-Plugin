name: TS · 项目测试
default_kind: goal
behavior: answer
description: 要编写测试代码；先定测什么、「哪条路算烟」要讨论
domain: code
framed: true
dispatch: [goal, design, record, work]
hints:
  create: |
    ## 这一条的产物是「测试代码」，不是「跑一遍」

    这两件事完全不同：

      校验（WV）   跑一遍，看结果对不对 —— 不用写代码
      测试（TS）   写测试代码，以后它自己会一直守着

    所以这里的核心问题是：**这批测试该覆盖什么？**

    ## 「哪条路算烟」要讨论

    冒烟测试不是「随便跑跑」，是「选一条最能代表系统活着的路」。
    选哪一条是有判断的：

      · 用户每天走得最多的那条？
      · 一断就全站不可用的那条？
      · 最后一次改动最容易碰坏的那条？

    这三个答案选出来的「烟」完全不同。所以要在这里讨论清楚，而不是直接开工。

  fail: |
    目标不会失败。它只会被「取消」。
    测试写不下去，通常是「测什么」没定清 —— 回去改 coverage。

body:
  - type: markdown
    attributes:
      value: |
        这一份只定「测什么、为什么是它」。
        具体写代码是派生任务（WT 实现项）的事。

  - type: [ask, textarea]
    id: kind
    attributes:
      label: 写哪类测试
      max_picks: 99
      options:
        - 冒烟测试：挑一条最能代表系统活着的路
        - 边缘测试：空数据 / 超长 / 并发 / 权限不足
        - 性能测试：量数字，和基线比
        - 回归测试：改动之后旧行为没坏
        - 兼容测试：旧数据 / 旧版本还能不能用
        - 集成测试：多个模块连起来能不能跑通
      description: |
        可以多选。勾完在下一章钉住「哪一种决定放行」。
    validations:
      required: true

  - type: [ask, textarea]
    id: kind_primary
    attributes:
      label: 哪种决定放行
      max_picks: 1
      options:
        - 冒烟测试
        - 边缘测试
        - 性能测试
        - 回归测试
        - 兼容测试
        - 集成测试
      description: |
        上面勾了哪些，这里钉住**哪一种说了算**。

        判据只看主要的那个：它过了就算通过，其余的不通过可以记下来。

        必须是上面勾过的之一。
    validations:
      required: true

  - type: textarea
    id: coverage
    attributes:
      label: 测什么
      description: |
        **这一章是核心。** 说清这批测试要覆盖哪些行为。

        按上面的类型写，要具体到能被反驳：

          冒烟   用户在首页点「导出」→ 拿到文件 → 文件能打开
                 这一条就是「烟」：它断了说明系统没在正常工作
          边缘   输入为空、输入 10 万行、两个人同时导出
          性能   导出 1 万行要在 2 秒内
          回归   原来能导出的 5 种格式，改完之后都还能导

        **「太简单的不测」和「太难的不测」都要写出来** ——
        它们决定了这批测试的上限。
    validations:
      required: true

  - type: textarea
    id: fixture
    attributes:
      label: 怎么造数据
      description: |
        测试跑起来需要什么数据？从哪来？

          · 手写的固定样本（最能定位问题，但覆盖窄）
          · 从生产脱敏导出（真实，但体积大、要处理隐私）
          · 程序随机生成（覆盖广，但出问题时难复现）

        这一步经常被跳过，然后在写测试时卡住。

  - type: [ask, textarea]
    id: blocking
    attributes:
      label: 不通过会怎样
      max_picks: 1
      options:
        - 阻塞发布：没过就不发
        - 阻塞某个改动：这条过了才能合
        - 只做记录：记录了，人工判断
        - 还不确定
      description: |
        这一栏让测试**有后果**。

        同样一条「P95 必须 < 500ms」，如果是「只做记录」，不过也就记一笔；
        如果是「阻塞发布」，不过就得停下来修。

        不写它，测试跑完没人知道该不该放行。
    validations:
      required: true

  - type: textarea
    id: not
    attributes:
      label: 这次不测什么
      description: |
        明确划出范围外的东西。

        测试最容易失控：说好测导出，顺手把导入也测了，结果导出没测完。

  - type: textarea
    id: other
    attributes:
      label: 其他
      description: |
        这套框架装不下的东西写这里。