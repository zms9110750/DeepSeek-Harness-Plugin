name: RR · 汇报
default_kind: record
behavior: write
description: 只读的结论汇报；写完即完，不占位
domain: general
framed: true
dispatch: [goal, design, record, work]
hints:
  create: |
    结论先行。用户读完第一段就该知道结果。
    不要按"我做了什么"组织，要按"用户关心什么"组织。
  fail: |
    汇报不会失败。
    但也**不要罗列过程**：读者要的是结论，过程只留支撑结论的那几条依据。

body:
  - type: textarea
    id: conclusion
    attributes:
      label: 结论
      description: |
        第一句就是答案。不要铺垫、不要背景、不要"让我来介绍一下"。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 依据
      description: |
        每条结论后面跟可核对的东西：链接、文件路径、命令输出、原文引用。
        "根据经验"不算依据。
  - type: textarea
    id: limits
    attributes:
      label: 不确定的地方
      description: |
        明确写出哪些是推测、哪些没验证。
        这一节写"无"通常代表谎报——除非真的全部验证过。
  - type: textarea
    id: deliver
    attributes:
      label: 交付
      description: |
        这一条**产出了什么**。记录的价值全在这里：写出来的东西本身，不是过程。

        写清三样：
          · 产物在哪（路径 / 链接 / 结论一句话）
          · 别人拿它做什么（下一步、判断依据、还是照做）
          · 它**过时了怎么知道**（改了什么之后这条就不准了）

        「我把事情做完了」不是交付。交付是一个**别人能拿走用的东西**。
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: 其他
      description: |
        汇报对象换了、需要保密的部分、以及要连带否定的其它计划。

        这套框架装不下的东西写这里。如果这里反复被填，说明模板缺了一节 ——
        回头改模板，别让它一直兜底。
