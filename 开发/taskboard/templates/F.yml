name: F · 复盘
description: 失败之后：为什么失败、凭什么下次不一样、下一步
labels: ["F"]
body:
  - type: textarea
    id: why
    attributes:
      label: 为什么失败
      description: 直接原因和根本原因
    validations:
      required: true
  - type: textarea
    id: next-time
    attributes:
      label: 我如何确信下一次不一样
      description: 穷举之外还缺什么知识？怎么正面把它补上
    validations:
      required: true
  - type: textarea
    id: next-step
    attributes:
      label: 下一步
      description: 变成新的研究计划，还是改设计重来（链到新计划）
