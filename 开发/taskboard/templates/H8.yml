name: H8 · 需要补充 · 子任务未回收
description: 派发出去的派生 / 依赖任务还没回来，父计划等它们
labels: ["H", "需要补充"]
body:
  - type: markdown
    attributes:
      value: |
        父计划要等子计划终结才能收尾。这一份记录"在等哪几张、等到什么程度"。
        注意：子计划处于进行态时会**挡住**父计划完成（硬规则），
        所以这份说明的是"我为什么还没完成"，不是"我要绕过规则"。
  - type: textarea
    id: children
    attributes:
      label: 在等哪几张
      description: 计划 id + 当前状态，一张一行
      placeholder: |
        T-020（处理中）写接口
        T-021（提交）还没人领
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 它们回来之后我做什么
      description: 合并、验收、还是直接结束父计划
      placeholder: 三张都完成后，我跑一遍集成测试再完成父计划
    validations:
      required: true
  - type: textarea
    id: partial
    attributes:
      label: 能不能先做一部分
      description: 有没有不依赖子计划的部分可以先推进
  - type: textarea
    id: risk
    attributes:
      label: 子计划卡住怎么办
      description: 如果某张长期不动，是我接手、放弃，还是 cancel 掉重派
