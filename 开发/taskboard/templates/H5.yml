name: H5 · 需要补充 · 需要先调研
description: 要外部事实才能继续；通常派发一张 R（研究）子计划
labels: ["H", "需要补充"]
body:
  - type: markdown
    attributes:
      value: |
        这一份是"派研究任务"的母版。真正干活的是它派出去的 R 计划，
        这张自己停在「需要补充」等结果回来。
  - type: textarea
    id: unknown
    attributes:
      label: 要查什么
      description: 一条一个具体问题，不要写"调研一下 X"这种没法验收的
      placeholder: |
        1. 这个库支持不支持 X？
        2. 官方推荐的做法是哪个？
    validations:
      required: true
  - type: textarea
    id: enough
    attributes:
      label: 查到什么程度算够
      description: 验收标准：能回答哪个问题、能让我做出哪个决定
      placeholder: 能确定用 A 还是 B，就算够
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: 去哪查
      description: 官方文档 / 源码 / 实测 / 找用户问；说清优先级
  - type: textarea
    id: child
    attributes:
      label: 派了哪张子计划
      description: 填 R 计划的 id；回来后把结论写进本节
      placeholder: "R-xxx（回来后在下一行补结论）"
  - type: textarea
    id: blocked-on
    attributes:
      label: 结论没回来之前能做什么
      description: 有没有不依赖这个结论的活可以先干；没有就写"只能等"
