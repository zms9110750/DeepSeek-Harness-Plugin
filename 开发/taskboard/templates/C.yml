name: C · 接口 / 界面
description: 对外长什么样：目标、暴露、功能、待议
labels: ["C"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 基于实际目标和阶段目标，这次要做成什么
    validations:
      required: true
  - type: textarea
    id: exposure
    attributes:
      label: 暴露
      description: 后来人没见过这个设计，怎么一眼看懂它怎么用
  - type: textarea
    id: features
    attributes:
      label: 功能
      description: 具体功能，什么情况下产生什么行为（含报错和边界）
    validations:
      required: true
  - type: textarea
    id: open-questions
    attributes:
      label: 待议
      description: 还没定的事；定不下来就单独立一张计划，链到这里
