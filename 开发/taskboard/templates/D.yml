name: D · 实现
description: 落到代码：工具、细节、魔数
labels: ["D"]
body:
  - type: textarea
    id: tools
    attributes:
      label: 工具
      description: 用哪些包、哪些技术实现
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 细节
      description: 封装的要点、容易写错的地方
  - type: textarea
    id: magic
    attributes:
      label: 魔数
      description: 一拍脑袋定的、可以推翻的实现细节（缓存上限、超时、阈值）
