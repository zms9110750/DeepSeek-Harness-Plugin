name: H4 · 需要补充 · 缺用户信息
description: 要用户提供只有他知道的事，才能继续
labels: ["H", "需要补充"]
body:
  - type: markdown
    attributes:
      value: |
        这一份要把"缺什么"问**具体**。能一次问完的不要分三次问；
        无法从代码/文档推断的才值得问用户。
  - type: textarea
    id: missing
    attributes:
      label: 具体缺哪几条
      description: 一条一行，每条都是可以用一句话回答的问题
      placeholder: |
        1. 这个服务用哪个环境？
        2. 预算上限是多少？
        3. 出问题找谁？
    validations:
      required: true
  - type: textarea
    id: usage
    attributes:
      label: 每条用来做什么
      description: 为什么这条信息会影响做法——让用户知道为什么值得回答
      placeholder: 环境决定用测试库还是生产库，直接影响能不能跑
    validations:
      required: true
  - type: textarea
    id: assumption
    attributes:
      label: 没有它会怎样
      description: 我现在按什么假设在做？这个假设错了会有什么后果？
    validations:
      required: true
  - type: textarea
    id: fallback
    attributes:
      label: 能不能先绕过
      description: 有没有不依赖这些信息的做法（做一半、或用默认值先跑）
