name: R · 研究
description: 先搞清事实：已知事实、怎么研究、结果
labels: ["R"]
body:
  - type: textarea
    id: facts
    attributes:
      label: 已知事实
      description: 已经确认的事实（带来源）
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: 如何研究
      description: 参数测试、读源码、读文档、看成品——用哪种
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 结果
      description: 结论；没结论就写还缺什么知识、下一步去哪查
