name: H3 · 需要授权 · 方案缺陷过大
description: 当前设计走不通，要换路子；可能降级成调研，或等用户给方向
labels: ["H", "需要授权"]
body:
  - type: markdown
    attributes:
      value: |
        这一份的关键是**说清缺陷**，而不是急着给新方案。新方案如果也不确定，
        应该另立一张 R（研究）计划，链到这里。
  - type: textarea
    id: defect
    attributes:
      label: 缺陷是什么
      description: 具体到"哪一步会坏、坏成什么样"。不要写"感觉不太行"
      placeholder: 这个接口在并发下会重复扣款；方案里没有幂等
    validations:
      required: true
  - type: textarea
    id: why-now
    attributes:
      label: 为什么做之前没发现
      description: 是信息不足、还是当时判断错了；这一条决定以后怎么少踩
  - type: textarea
    id: tried
    attributes:
      label: 已经试过什么
      description: 试过哪些补救、为什么都不行
  - type: textarea
    id: next
    attributes:
      label: 下一步选项
      description: |
        通常三种：
        1. 另立 R 计划先调研（推荐在不确定时）
        2. 用户给方向
        3. 直接放弃这条线
    validations:
      required: true
  - type: textarea
    id: salvage
    attributes:
      label: 有什么能留下
      description: 已经写好的代码/结论里，哪部分在新方案里还能用
