name: H7 · 需要授权 · 缺权限 / 操作环境不对
description: 工具被权限或环境挡住，要先改变操作环境才能继续
labels: ["H", "需要授权"]
body:
  - type: markdown
    attributes:
      value: |
        这一份只回答"环境差在哪"。改权限本身就是一次需要用户点头的动作，
        所以默认落「需要授权」。
  - type: textarea
    id: blocked-tool
    attributes:
      label: 哪个工具 / 操作被挡住
      description: 工具名 + 报错原文（别转述）
      placeholder: "pwsh：SetNamedSecurityInfoW failed (Win32 5)"
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: 缺什么
      description: 是文件权限、网络、装包、系统设置，还是会话的权限档位太低
      placeholder: 工作区缺「取得所有权」；需要完全权限档
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: 要改什么环境
      description: 具体动作，能一步做完的就写成一步
      placeholder: 把会话权限改成「完全权限」，或给 X 目录加写权限
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: 改完怎么验证
      description: 一条能跑通的命令或一次能成功的最小操作
      placeholder: 能成功执行 `Get-ChildItem X:\temp\dsh`
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 改环境的风险
      description: 放宽权限会不会让别的东西越界；能不能只对这一个目录放开
