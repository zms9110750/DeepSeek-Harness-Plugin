name: A · 问题
description: 一个痛点或需求：为什么需要它、什么算满意、有没有先例
labels: ["A"]
body:
  - type: markdown
    attributes:
      value: |
        这一份只回答"问题本身"，不写设计和实现。
  - type: input
    id: pain
    attributes:
      label: 痛点 / 验收
      description: 用户为什么需要这个？做到什么程度算满意？
      placeholder: 一句话说清痛点，再补一句验收标准
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 现在的做法是什么，痛在哪一步
      placeholder: 我现在是……；每次都要……；最烦的是……
    validations:
      required: true
  - type: textarea
    id: fitness
    attributes:
      label: 适用性
      description: 什么前提下才成立？长期搁置会失去什么意义？
  - type: textarea
    id: precedent
    attributes:
      label: 先例
      description: 同类产品/实现长什么样，能抄什么、必须改什么
