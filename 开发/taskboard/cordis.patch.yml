# 任务板 —— 一个包，五个插件条目。
#
# 设置页看到的是一张「任务板」卡片，点进去能看到全部组件。
#
# 后端分四条 row（各自独立开关）：
#   taskboard            ← 承载客户端与设置页（这条也是 UI 开关所在）
#   taskboard-templates
#   taskboard-plan-preset
#   taskboard-workspace
#
# ⚠️ `taskboard` 这条必须用**裸包名** `@local/taskboard`：
# 客户端模块发现只接受两段式包名（exactPackageSpecifier），
# 子路径 `@local/taskboard/core` 会让它直接放弃扫描 → 客户端不加载。

- insert:
    # ① 客户端与设置页（两个 UI 的开关在这个 row 的 config 里）
    - id: taskboard
      name: '@local/taskboard'
      config:
        ui:
          drawer: true
          sidebar: true

    # ② 后端实现：存储、事项模型、状态机、AI 工具、命令
    - id: taskboard-core
      name: '@local/taskboard/core'

    # ③ 默认任务模板：附加的 23 个（内置 4 个在 core 里）
    - id: taskboard-templates
      name: '@local/taskboard/templates'

    # ④ 按计划的权限：一个新的权限档，按任务给出的权限工作
    - id: taskboard-plan-preset
      name: '@local/taskboard/plan-preset'

    # ⑤ 子工作空间：可写范围限制在里面（依赖 ④）
    - id: taskboard-workspace
      name: '@local/taskboard/workspace'
