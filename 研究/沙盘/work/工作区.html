<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作区 · AI 改版沙盘</title>
<style>
  :root{
    --bg:#f4f5f6; --card:#fff; --border:#e4e6e8; --border-2:#d3d6da;
    --text:#23262b; --text-2:#6b7075; --text-3:#9ba0a6;
    --black:#1a1d21; --brand:#3b7dd8; --goal:#7c5cd6; --work:#2e9e6b;
    --record:#8a9099; --warn:#c98a20; --danger:#c0392b;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:22px 20px 60px;background:var(--bg);color:var(--text);
    font:13px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  h1{margin:0 0 4px;font-size:18px;font-weight:650}
  .sub{margin:0 0 18px;color:var(--text-2);font-size:12.5px;max-width:900px}
  .sub code{font:11.5px ui-monospace,Menlo,Consolas,monospace;background:#eceef0;padding:1px 5px;border-radius:3px}
  .toplink{float:right;font-size:12px;color:var(--brand);text-decoration:none;
    padding:5px 11px;border:1px solid var(--brand);border-radius:6px}
  .toplink:hover{background:rgba(59,125,216,.07)}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:18px;align-items:start}
  @media(max-width:1180px){.layout{grid-template-columns:1fr}}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:10px;
    box-shadow:0 1px 3px rgba(16,18,22,.06),0 8px 24px rgba(16,18,22,.05);overflow:hidden}
  .panel-head{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border)}
  .panel-title{font-weight:650;font-size:13.5px}
  .count{color:var(--text-3);font-size:11.5px}
  .grow{flex:1}
  .btn{font:inherit;font-size:12px;padding:5px 11px;border-radius:6px;border:1px solid var(--border-2);
    background:#fff;color:var(--text);cursor:pointer}
  .btn:hover{border-color:#b9bdc2}
  .btn.primary{background:var(--black);border-color:var(--black);color:#fff;font-weight:550}

  .groups{display:flex;align-items:center;gap:6px;padding:9px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap;background:#fcfcfd}
  .group{font:inherit;font-size:12px;padding:4px 11px;border-radius:14px;border:1px solid var(--border-2);
    background:#fff;color:var(--text-2);cursor:pointer}
  .group.on{background:var(--black);border-color:var(--black);color:#fff;font-weight:600}
  .group .n{opacity:.65;font-size:11px;margin-left:3px}

  .filters{display:flex;align-items:center;gap:6px;padding:9px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .chip{font:inherit;font-size:11.5px;padding:3px 10px;border-radius:12px;border:1px solid var(--border-2);
    background:#fff;color:var(--text-2);cursor:pointer}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .search{font:inherit;font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid var(--border-2);
    background:#fff;outline:none;width:150px;margin-left:auto}

  .rows{max-height:520px;overflow:auto}
  .row{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:9px;
    padding:9px 14px;border-bottom:1px solid #f0f1f2;cursor:pointer;text-align:left;
    background:transparent;border-left:0;border-right:0;border-top:0;font:inherit;width:100%}
  .row:hover{background:#f7faff}
  .row.on{background:#eef3fb;box-shadow:inset 3px 0 0 var(--brand)}
  .row .id{font-weight:700;font-size:11.5px;letter-spacing:.02em;flex:none}
  .row .kind{font-size:10px;padding:1px 6px;border-radius:3px;flex:none}
  .row .title{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .row .dot{font-size:8px;flex:none}

  .detail{background:var(--card);border:1px solid var(--border);border-radius:10px;
    box-shadow:0 1px 3px rgba(16,18,22,.06),0 8px 24px rgba(16,18,22,.05);
    display:flex;flex-direction:column;max-height:calc(100vh - 120px);position:sticky;top:16px}
  .d-head{padding:13px 15px 10px;border-bottom:1px solid var(--border);flex:none;position:relative}
  .d-top{display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .d-top .id{font-weight:700;font-size:12px}
  .d-top .kind{font-size:10px;padding:1px 7px;border-radius:3px}
  .d-top .tpl{font-size:10px;padding:1px 6px;border-radius:3px;border:1px solid var(--border-2);color:var(--text-3)}
  .icon-btn{width:26px;height:26px;padding:0;border:0;border-radius:5px;background:transparent;
    color:var(--text-2);cursor:pointer;font-size:13px;display:grid;place-items:center}
  .icon-btn:hover{background:#f2f4f6}
  .d-head h3{margin:0 0 7px;font-size:16px;font-weight:650;line-height:1.35}
  .d-meta{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--text-2);flex-wrap:wrap}
  .status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:10px;
    font:inherit;font-size:11px;font-weight:600;border:1px solid transparent;background:transparent;cursor:pointer}
  .status-menu{position:absolute;left:15px;top:calc(100% + 6px);z-index:30;width:236px;padding:5px;
    background:#fff;border:1px solid var(--border-2);border-radius:8px;
    box-shadow:0 4px 10px rgba(16,18,22,.08),0 16px 40px rgba(16,18,22,.16)}
  .status-menu[hidden]{display:none}
  .menu-cap{font-size:10px;font-weight:700;color:var(--text-3);letter-spacing:.06em;padding:6px 9px 4px}
  .menu-item{display:flex;align-items:center;gap:8px;width:100%;padding:6px 9px;font:inherit;font-size:12.5px;
    text-align:left;background:transparent;border:0;border-radius:5px;cursor:pointer;color:var(--text)}
  .menu-item:hover{background:#f2f4f6}
  .menu-item .ic{flex:none;width:14px;text-align:center;opacity:.7}
  .menu-item.primary{color:var(--brand);font-weight:600}
  .menu-item.bad{color:var(--danger)}
  .menu-note{font-size:10.5px;color:var(--text-3);padding:6px 9px;line-height:1.5;
    border-top:1px solid var(--border);margin-top:4px}

  .parent-row{display:flex;align-items:center;gap:8px;padding:8px 15px;
    border-bottom:1px solid var(--border);flex:none;background:#fcfcfd}
  .rel-toggle{display:inline-flex;align-items:center;gap:5px;flex:none;padding:4px 9px;font:inherit;
    font-size:11.5px;color:var(--text-2);background:#fff;border:1px solid var(--border-2);
    border-radius:6px;cursor:pointer}
  .rel-toggle[aria-expanded="true"]{background:#eef0f2}
  .rel-toggle .n{font-size:10px;font-weight:700;padding:0 5px;border-radius:8px;
    background:#eceef0;color:var(--text-2);line-height:15px}
  .rel-toggle .chev{font-size:8px;transition:transform .15s;display:inline-block}
  .rel-toggle[aria-expanded="true"] .chev{transform:rotate(90deg)}
  .vsep{width:1px;height:16px;background:var(--border-2);flex:none}
  .pcap{font-size:11px;font-weight:600;color:var(--text-3);flex:none}
  .pbtn{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;font:inherit;font-size:11px;
    background:#fff;border:1px solid var(--border-2);border-radius:8px;color:var(--brand);cursor:pointer}
  .derive-btn{display:inline-flex;align-items:center;gap:5px;flex:none;padding:5px 11px;font:inherit;
    font-size:12px;font-weight:550;background:#fff;border:1px solid var(--border-2);
    border-radius:6px;color:var(--text);cursor:pointer;margin-left:auto}
  .derive-btn:hover{border-color:var(--black);background:#f7f8f9}

  .rel-body{padding:0 15px 10px;border-bottom:1px solid var(--border);background:#fbfbfc;flex:none}
  .rel-body[hidden]{display:none}
  .rel-headrow{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;
    background:#e4e7ea;border:1px solid var(--border-2);border-bottom:2px solid var(--border-2);
    border-radius:5px 5px 0 0;overflow:hidden}
  .rel-head{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
    padding:6px 9px;border-left:3px solid var(--border-2)}
  .rel-head.active{border-left-color:var(--brand)}
  .rel-head.held{border-left-color:var(--warn)}
  .rel-head.done{border-left-color:var(--work)}
  .rel-block{margin-top:8px}
  .rel-banner{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;
    color:var(--text-2);letter-spacing:.03em;padding:3px 9px;background:#eef0f2;
    border-left:3px solid var(--border-2);border-radius:4px 4px 0 0}
  .rel-cells{display:grid;grid-template-columns:repeat(3,1fr)}
  .rel-cell{padding:5px 4px 3px;display:grid;gap:3px;align-content:start;border-radius:4px}
  .rel-cell.void{background-image:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(0,0,0,.022) 3px,rgba(0,0,0,.022) 6px)}
  .rel-item{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;font:inherit;font-size:11px;
    line-height:20px;background:#fff;border:1px solid var(--border);border-radius:8px;
    color:var(--brand);cursor:pointer;white-space:nowrap}
  .rel-item:hover{border-color:var(--brand)}

  .d-body{overflow:auto;padding:4px 15px 14px;flex:1;min-height:0}
  .sec{border-top:1px solid var(--border);padding:11px 0 2px}
  .sec:first-child{border-top:0}
  .sec-title{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;
    color:var(--text-3);letter-spacing:.04em;margin-bottom:8px}
  .sec-title .n{font-size:10px;font-weight:700;padding:0 5px;border-radius:8px;
    background:#eceef0;color:var(--text-2);line-height:15px}
  .prose{font-size:12.5px;line-height:1.7;word-break:break-word}
  .prose code{font:11.5px ui-monospace,Menlo,Consolas,monospace;background:#f2f4f6;padding:1px 4px;border-radius:3px}
  .prose p{margin:0 0 8px}
  .prose h3{margin:12px 0 6px;font-size:14px;font-weight:650}
  .prose h4{margin:10px 0 5px;font-size:13px;font-weight:650}
  .prose h5,.prose h6{margin:9px 0 4px;font-size:12.5px;font-weight:650}
  .prose ul,.prose ol{margin:0 0 8px;padding-left:20px}
  .prose li{margin:2px 0}
  .prose blockquote{margin:0 0 8px;padding:6px 10px;border-left:2px solid var(--border-2);
    background:#f7f8f9;color:var(--text-2);font-size:12px}
  .prose hr{margin:10px 0;border:0;border-top:1px solid var(--border)}
  .prose strong{font-weight:650}
  .prose table{border-collapse:collapse;margin:0 0 9px;font-size:12px;width:100%}
  .prose th,.prose td{border:1px solid var(--border);padding:4px 8px;text-align:left;vertical-align:top}
  .prose th{background:#f2f4f6;font-weight:650;white-space:nowrap}
  .prose td code{font-size:11px}
  .prose pre.code{margin:0 0 9px;padding:9px 11px;background:#f7f8f9;border:1px solid var(--border);
    border-radius:6px;overflow-x:auto;font-size:11.5px;line-height:1.6}
  .prose pre.code code{background:transparent;padding:0;font-family:ui-monospace,Menlo,Consolas,monospace;
    color:var(--text);white-space:pre;font-size:inherit}
  .prose pre.code code[data-lang]::before{content:attr(data-lang);display:block;font-size:10px;
    color:var(--text-3);margin-bottom:4px;font-family:inherit}

  .inter{border:1px solid var(--border);border-radius:8px;padding:10px 11px 11px;margin-bottom:9px;background:#fcfcfd}
  .inter-cap{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;font-size:11.5px;
    font-weight:650;margin-bottom:8px}
  .inter-cap .src{font-size:10px;font-weight:500;color:var(--text-3);padding:0 5px;
    border-radius:3px;background:#eceef0}
  .choice{display:flex;align-items:flex-start;gap:8px;width:100%;padding:8px 11px;margin-bottom:6px;
    font:inherit;font-size:12.5px;text-align:left;color:var(--text);background:#fff;
    border:1px solid var(--border-2);border-radius:7px;cursor:pointer}
  .choice:hover{border-color:var(--brand);background:#f7faff}
  .choice.on{border-color:var(--brand);background:#f7faff;color:var(--brand);font-weight:600}
  .choice .radio{flex:none;width:13px;height:13px;border-radius:50%;border:1.5px solid var(--border-2);
    display:grid;place-items:center;margin-top:2px}
  .choice.on .radio{border-color:var(--brand)}
  .choice.on .radio::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--brand)}
  .rank-row{display:flex;align-items:center;gap:8px;padding:6px 9px;margin-bottom:4px;
    background:#fff;border:1px solid var(--border-2);border-radius:6px;font-size:12.5px}
  .rank-row .no{flex:none;width:16px;color:var(--text-3);font-size:10px}
  .rank-row .txt{flex:1}
  .quick-task{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;margin:0 6px 6px 0;
    font:inherit;font-size:12px;background:#fff;border:1px dashed var(--border-2);
    border-radius:6px;cursor:pointer}
  .quick-task:hover{border-style:solid;border-color:var(--brand);color:var(--brand)}
  .quick-task .code{font-size:10px;font-weight:700;color:var(--text-3);padding:0 4px;
    border-radius:3px;background:#f0f2f4}
  .unknown{border:1px dashed var(--border-2);border-radius:6px;background:#f7f8f9;
    padding:9px 11px;font-size:11.5px;color:var(--text-2)}
  .unknown pre{margin:5px 0 0;font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}

  .d-foot{padding:10px 15px 12px;border-top:1px solid var(--border);flex:none;background:#fcfcfd}
  .ta{width:100%;min-height:48px;resize:vertical;padding:8px 10px;font:12.5px/1.55 inherit;
    font-family:inherit;border:1px solid var(--border-2);border-radius:6px;outline:none;background:#fff}

  .writer{background:var(--card);border:1px solid var(--border);border-radius:10px;
    box-shadow:0 1px 3px rgba(16,18,22,.06);padding:14px 16px;margin-top:18px}
  .writer h2{margin:0 0 6px;font-size:14px;font-weight:650}
  .writer p{margin:0 0 10px;font-size:12px;color:var(--text-2)}
  .writer p code{font:11px ui-monospace,Menlo,Consolas,monospace;background:#eceef0;padding:1px 5px;border-radius:3px}
  .writer textarea{width:100%;min-height:200px;padding:11px 12px;font:12.5px/1.7 ui-monospace,Menlo,Consolas,monospace;
    border:1px solid var(--border-2);border-radius:7px;outline:none;resize:vertical;background:#fcfcfd}
  .writer-row{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:11.5px;color:var(--text-3)}
  .saved{color:var(--work);font-weight:600}

  .mask{position:fixed;inset:0;z-index:100;background:rgba(20,22,26,.32);
    display:grid;place-items:center;padding:24px}
  .modal{background:#fff;border-radius:10px;box-shadow:0 24px 60px rgba(16,18,22,.28);
    width:min(680px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
  .modal-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border)}
  .modal-head b{font-size:14px;font-weight:650}
  .modal-body{padding:14px 16px;overflow:auto;display:grid;gap:11px}
  .modal-foot{display:flex;align-items:center;gap:9px;padding:11px 16px;border-top:1px solid var(--border);background:#fcfcfd}
  .hint{font-size:10.5px;color:var(--text-3)}


  /* ── 视图切换 ── */
  .views{display:inline-flex;border:1px solid var(--border-2);border-radius:6px;overflow:hidden}
  .vw{font:inherit;font-size:11.5px;padding:4px 11px;border:0;background:#fff;
    color:var(--text-2);cursor:pointer}
  .vw + .vw{border-left:1px solid var(--border-2)}
  .vw.on{background:var(--black);color:#fff;font-weight:600}

  /* ── 图例：解释连线颜色，不是视图切换 ── */
  .legend{display:inline-flex;align-items:center;gap:9px;flex-wrap:wrap}
  .legend[hidden]{display:none}
  .lg{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--text-3);white-space:nowrap}
  .lg svg{display:block}

  /* ── 科技树 ── */
  .treeview{height:520px;overflow:auto;padding:12px 14px;position:relative}
  .treeview[hidden]{display:none}
  .tree-canvas{position:relative;margin:0 auto;min-width:100%}
  .tree-node{position:absolute;box-sizing:border-box;width:150px;height:50px;
    padding:6px 8px;display:flex;flex-direction:column;gap:2px;
    background:#fff;border:2px solid var(--border-2);border-radius:9px;
    cursor:pointer;transition:border-color .12s,box-shadow .12s}
  .tree-node:hover{border-color:var(--brand);box-shadow:0 2px 8px rgba(59,125,216,.18)}
  .tree-node.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
  .tree-node .top{display:flex;align-items:center;gap:5px}
  .tree-node .tid{font-size:10.5px;font-weight:700}
  .tree-node .tk{font-size:9px;padding:0 4px;border-radius:2px;background:rgba(0,0,0,.05)}
  .tree-node .tt{font-size:11px;font-weight:600;color:var(--text);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tree-empty{display:grid;place-items:center;height:100%;color:var(--text-3);font-size:12px}

  /* ── 新建/编辑浮层（照原型「建议版」）── */
  .field{display:grid;gap:4px}
  .lbl{font-size:11px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:3px}
  .req{color:var(--danger);font-weight:700}
  .modal-body.two-col{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
  .modal-body.two-col > div{min-width:0}
  .modal-body input[type="text"],.modal-body select,.modal-body textarea{
    font:inherit;font-size:12.5px;padding:7px 10px;border:1px solid var(--border-2);
    border-radius:6px;outline:none;background:#fff;width:100%;box-sizing:border-box}
  .modal-body input[type="text"]:focus,.modal-body select:focus,.modal-body textarea:focus{
    border-color:var(--brand);box-shadow:0 0 0 2px rgba(59,125,216,.1)}
  .modal-body textarea{font-family:ui-monospace,Menlo,Consolas,monospace;line-height:1.6;resize:vertical}

  /* 模板选择按钮 */
  .tpl-btn{display:flex;align-items:center;gap:7px;width:100%;padding:7px 10px;
    font:inherit;font-size:12.5px;background:#fff;border:1px solid var(--border-2);
    border-radius:6px;cursor:pointer;text-align:left}
  .tpl-btn:hover{border-color:#b9bdc2}
  .tpl-btn .code{font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:3px;
    background:#eceef0;color:var(--text-2)}
  .tpl-btn .chev{margin-left:auto;font-size:9px;color:var(--text-3)}

  /* 弹出的三列面板 */
  .tpl-pop{position:absolute;left:0;top:calc(100% + 6px);z-index:40;
    background:#fff;border:1px solid var(--border-2);border-radius:8px;
    box-shadow:0 4px 10px rgba(16,18,22,.08),0 16px 40px rgba(16,18,22,.16);
    width:560px;max-width:calc(100vw - 80px);max-height:min(360px, 46vh);
    display:flex;flex-direction:column;overflow:hidden}
  .tpl-pop[hidden]{display:none}
  .tpl-grid{display:grid;grid-template-columns:1fr 1fr 1.35fr;max-height:150px;overflow:auto;flex:none}
  .tpl-col{border-right:1px solid var(--border);padding:5px 4px 6px}
  .tpl-col:last-child{border-right:0}
  .tpl-col-head{font-size:10px;font-weight:700;color:var(--text-3);letter-spacing:.06em;
    padding:5px 8px 4px}
  .tpl-item{display:flex;align-items:center;gap:6px;width:100%;padding:5px 8px;
    font:inherit;font-size:12px;text-align:left;background:transparent;border:0;
    border-radius:5px;cursor:pointer;color:var(--text)}
  .tpl-item:hover{background:#f2f4f6}
  .tpl-item.on{background:#eef3fb;color:var(--brand);font-weight:600}
  .tpl-item .radio{flex:none;width:11px;height:11px;border-radius:50%;
    border:1.5px solid var(--border-2)}
  .tpl-item.on .radio{border-color:var(--brand);background:var(--brand);
    box-shadow:inset 0 0 0 2px #fff}
  .tpl-item .k-letter,.tpl-item .tpl-code{flex:none;font-size:10px;font-weight:700;
    color:var(--text-3);width:12px;text-align:center}
  .tpl-item.on .k-letter,.tpl-item.on .tpl-code{color:var(--brand)}
  .tpl-item .tpl-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tpl-preview{border-top:1px solid var(--border);padding:7px 10px;font-size:11px;
    color:var(--text-3)}
  .tpl-preview b{color:var(--text);font-weight:700}

  /* ── 选项卡（关系 / 高级设置）──
     两个都可以不激活：都不点的时候对话框只有「标题 / 模板 / 父任务 / 正文」。 */
  .tabs{display:flex;gap:6px;padding-top:2px}
  .tab{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;font:inherit;
    font-size:11.5px;color:var(--text-2);background:#fff;border:1px solid var(--border-2);
    border-radius:14px;cursor:pointer}
  .tab:hover{border-color:#b9bdc2}
  .tab[aria-pressed="true"]{background:#eef3fb;border-color:var(--brand);color:var(--brand);font-weight:600}
  .tab .cnt{font-size:10px;font-weight:700;padding:0 5px;border-radius:8px;
    background:#eceef0;color:var(--text-2);line-height:15px}
  .tab[aria-pressed="true"] .cnt{background:rgba(59,125,216,.15);color:var(--brand)}
  .tab-panel{display:grid;gap:9px;padding:10px 11px;background:#fafbfc;
    border:1px solid var(--border);border-radius:7px}
  .tab-panel[hidden]{display:none}
  .rel-list{display:grid;gap:6px}
  .rel-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px;align-items:center}
  .rel-row .rel-kind{font:inherit;font-size:11.5px;padding:5px 7px;border:1px solid var(--border-2);
    border-radius:5px;background:#fff;outline:none}
  .rel-row .rel-target{font:inherit;font-size:11.5px;padding:5px 8px;border:1px solid var(--border-2);
    border-radius:5px;background:#fff;outline:none;width:100%;box-sizing:border-box}
  .rel-row .rel-dir{font-size:10.5px;color:var(--text-3);white-space:nowrap}
  .rel-row .rel-del{padding:0 5px;font:inherit;font-size:12px;color:var(--text-3);
    background:transparent;border:0;cursor:pointer;border-radius:4px}
  .rel-row .rel-del:hover{background:#f2f4f6;color:var(--danger)}

  /* ── 正文里的代码块和表格 ── */
  .prose pre.code{margin:0 0 9px;padding:9px 11px;background:#f7f8f9;border:1px solid var(--border);
    border-radius:6px;overflow-x:auto;font-size:11.5px;line-height:1.6}
  .prose pre.code code{background:transparent;padding:0;font-family:ui-monospace,Menlo,Consolas,monospace;
    color:var(--text);white-space:pre;font-size:inherit}
  .prose pre.code code[data-lang]::before{content:attr(data-lang);display:block;font-size:10px;
    color:var(--text-3);margin-bottom:4px;font-family:inherit}
  .prose table{border-collapse:collapse;margin:0 0 9px;font-size:12px;width:100%}
  .prose th,.prose td{border:1px solid var(--border);padding:4px 8px;text-align:left;vertical-align:top}
  .prose th{background:#f2f4f6;font-weight:650;white-space:nowrap}
  .prose td code{font-size:11px}

  /* ── 详情页头部：编号在左（半行高 + 两个标签），标题在右 ── */
  .d-head-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
  .d-head-left{display:flex;flex-direction:column;gap:3px;min-width:0}
  .d-head-left .id{font-weight:700;font-size:12.5px;letter-spacing:.02em;line-height:1.1}
  .d-head-tags{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .d-head-tags .kind{font-size:9.5px;padding:0 5px;border-radius:3px;line-height:14px}
  .d-head-tags .domain{font-size:9.5px;padding:0 5px;border-radius:3px;line-height:14px;
    border:1px solid var(--border-2);color:var(--text-3)}
  .d-head-right{display:flex;align-items:flex-start;gap:8px;min-width:0}
  .d-head-title{flex:1;font-size:19px;font-weight:650;line-height:1.28;color:var(--text);
    overflow-wrap:break-word;min-width:0}
  .d-head-icons{display:flex;gap:1px;flex:none}

  /* ── 过滤栏（二级菜单，三级占文档流）── */
  .filter-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%}
  .filter-btn{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;font:inherit;
    font-size:11.5px;color:var(--text-2);background:#fff;border:1px solid var(--border-2);
    border-radius:14px;cursor:pointer}
  .filter-btn:hover{border-color:#b9bdc2}
  .filter-btn.on{background:#eef3fb;border-color:var(--brand);color:var(--brand);font-weight:600}
  .filter-btn.has{border-color:var(--brand);color:var(--brand)}
  .filter-btn .n{font-size:10px;font-weight:700;padding:0 5px;border-radius:8px;
    background:var(--brand);color:#fff;line-height:15px}
  .filter-btn .chev{font-size:8px;opacity:.6}
  .filter-clear{font:inherit;font-size:11px;color:var(--text-3);background:transparent;
    border:0;cursor:pointer;text-decoration:underline;padding:2px 4px}
  .filter-clear:hover{color:var(--danger)}

  .filter-panel{display:inline-flex;gap:0;margin-top:8px;align-self:flex-start;
    border:1px solid var(--border-2);border-radius:7px;overflow:hidden;background:#fff;
    box-shadow:0 2px 6px rgba(16,18,22,.06)}
  .filter-col{display:flex;flex-direction:column;gap:1px;padding:4px;min-width:96px;
    border-right:1px solid var(--border)}
  .filter-col:last-child{border-right:0}
  .filter-col.sub{min-width:130px;background:#fafbfc}
  .filter-item{display:flex;align-items:center;gap:6px;width:100%;padding:3px 8px;
    font:inherit;font-size:11.5px;line-height:1.5;text-align:left;background:transparent;
    border:0;border-radius:5px;cursor:pointer;color:var(--text);white-space:nowrap}
  .filter-item:hover{background:#f2f4f6}
  .filter-item.on{background:#eef3fb;color:var(--brand)}
  .filter-item.picked{font-weight:600}
  .filter-item.picked::before{content:'●';font-size:7px;color:var(--brand);margin-right:-2px}
  .filter-item .chev{margin-left:auto;font-size:8px;opacity:.5}
  .filter-item .tick{margin-left:auto;color:var(--brand);font-weight:700}
  .filter-item .tpl-code{font-size:10px;font-weight:700;color:var(--text-3);width:14px}
  .filter-sub-head{font-size:10px;font-weight:700;color:var(--text-3);letter-spacing:.05em;
    padding:3px 8px 4px;white-space:nowrap}
  .filter-empty{font-size:11.5px;color:var(--text-3);padding:6px 9px}

  /* ── 五个行动的渲染样式 ── */
  .sec-desc{font-size:11px;color:var(--text-3);line-height:1.6;margin-top:5px}
  .muted{color:var(--text-3);font-style:italic}
  .req{color:var(--danger);font-weight:700}
  .text-input{width:100%;box-sizing:border-box;padding:7px 10px;font:inherit;font-size:12.5px;
    line-height:1.6;color:var(--text);background:#fff;border:1px solid var(--border-2);
    border-radius:6px;outline:none;resize:vertical}
  .text-input:focus{border-color:var(--brand);box-shadow:0 0 0 2px rgba(59,125,216,.1)}

  .choice-body{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
  .choice-title{font-size:12.5px;line-height:1.45}
  .choice-sub{font-size:11px;color:var(--text-3);line-height:1.45}
  .choice.on .choice-sub{color:var(--brand);opacity:.75}

  .rank-body{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
  .rank-title{font-size:12.5px}
  .rank-sub{font-size:11px;color:var(--text-3)}
  .rank-btns{display:flex;gap:2px;flex:none}
  .rank-btns button{padding:0 5px;font:inherit;font-size:11px;color:var(--text-3);
    background:transparent;border:0;border-radius:4px;cursor:pointer}
  .rank-btns button:hover:not(:disabled){background:#f2f4f6;color:var(--text)}
  .rank-btns button:disabled{opacity:.3;cursor:default}

  .link-btn{padding:4px 2px;font:inherit;font-size:11px;color:var(--text-3);
    background:transparent;border:0;cursor:pointer;text-decoration:underline}
  .link-btn:hover{color:var(--brand)}

  .derive-row{display:flex;flex-wrap:wrap;gap:6px}
  .derive-row .quick-task .mode{font-size:9.5px;color:var(--text-3);margin-left:4px}

  /* ── 模板里章节 → 行动的预览 ── */
  .tpl-sections{border-top:1px solid var(--border);padding:8px 10px 9px;overflow:auto;flex:1;min-height:0}
  .tpl-sec-head{font-size:10px;font-weight:700;color:var(--text-3);letter-spacing:.05em;margin-bottom:5px}
  .tpl-sec{display:flex;align-items:baseline;gap:6px;padding:2px 0;font-size:11px;line-height:1.5}
  .tpl-sec-act{flex:none;font-size:9.5px;font-weight:700;padding:0 5px;border-radius:3px;
    line-height:15px;background:#eceef0;color:var(--text-2)}
  .tpl-sec-act[data-act="text"]{background:#e8f0fb;color:#2c6ab8}
  .tpl-sec-act[data-act="markdown"]{background:#f0f1f3;color:#6b7075}
  .tpl-sec-act[data-act="ask"]{background:#eaf5ee;color:#2c7a52}
  .tpl-sec-act[data-act="rank"]{background:#fdf2e3;color:#a9701a}
  .tpl-sec-act[data-act="derive"]{background:#f0ebfa;color:#6a4bc4}
  .tpl-sec-id{flex:none;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:10px;color:var(--text-3)}
  .tpl-sec-label{color:var(--text);flex:none}
  .tpl-sec-ph{color:var(--text-3);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;min-width:0}
  .tpl-sec-foot{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:6px;
    padding-top:6px;border-top:1px dashed var(--border);font-size:10.5px;color:var(--text-3)}
  .tpl-act-chip{font-size:9.5px;font-weight:700;padding:0 5px;border-radius:3px;
    line-height:15px;background:#eceef0;color:var(--text-2)}
  .tpl-sec-empty{font-size:11px;color:var(--text-3);line-height:1.5}

  /* 左栏常驻的「正文会问这些」 */
  .tpl-sections.inline{border:1px solid var(--border);border-radius:7px;
    background:#fafbfc;padding:8px 10px;max-height:250px;overflow:auto}
  .tpl-sec-count{margin-left:auto;font-size:9.5px;color:var(--text-3);font-weight:500}
  .tpl-sec-head{display:flex;align-items:center}

  /* mdx 源码（调试用） */
  .mdx-source{margin:0;padding:10px 12px;background:#f7f8f9;border:1px solid var(--border);
    border-radius:6px;font:11.5px/1.6 ui-monospace,Menlo,Consolas,monospace;
    color:var(--text);white-space:pre-wrap;word-break:break-all;overflow:auto;max-height:420px}
  .mdx{display:flex;flex-direction:column;gap:0}

  /* 多选的方框（和单选的圆点区分） */
  .choice .checkbox{flex:none;width:13px;height:13px;border-radius:3px;
    border:1.5px solid var(--border-2);display:grid;place-items:center;margin-top:2px}
  .choice.multi.on .checkbox{border-color:var(--brand);background:var(--brand)}
  .choice .checkbox .tick{color:#fff;font-size:9px;line-height:1;font-weight:700}
  .choice.multi.on .choice-sub{color:var(--brand);opacity:.75}
  .multi-count{font-size:10.5px;color:var(--text-3);margin-top:5px}

  /* ── 选项（ask 单选 / multi 多选共用外框）── */
  .inter{border:1px solid var(--border);border-radius:8px;padding:10px 11px 11px;
    margin-bottom:9px;background:#fcfcfd}
  .inter-cap{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;font-size:11.5px;
    font-weight:650;margin-bottom:8px;color:var(--text-2)}
  .inter-cap .src{font-size:10px;font-weight:500;color:var(--text-3);padding:0 5px;
    border-radius:3px;background:#eceef0}

  .choice{display:flex;align-items:flex-start;gap:8px;width:100%;padding:8px 11px;
    margin-bottom:6px;font:inherit;font-size:12.5px;text-align:left;color:var(--text);
    background:#fff;border:1px solid var(--border-2);border-radius:7px;cursor:pointer;
    transition:border-color .12s,background .12s}
  .choice:last-child{margin-bottom:0}
  .choice:hover{border-color:#b9bdc2;background:#fafbfc}
  .choice.on{border-color:var(--brand);background:#f4f8fe;color:var(--brand);font-weight:600}

  /* 单选：圆点 */
  .choice .radio{flex:none;width:13px;height:13px;border-radius:50%;
    border:1.5px solid var(--border-2);display:grid;place-items:center;margin-top:2px;
    background:#fff;transition:border-color .12s}
  .choice:hover .radio{border-color:#b9bdc2}
  .choice.on .radio{border-color:var(--brand)}
  .choice.on .radio::after{content:'';width:6px;height:6px;border-radius:50%;
    background:var(--brand);display:block}

  .choice-body{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
  .choice-title{font-size:12.5px;line-height:1.45}
  .choice-sub{font-size:11px;color:var(--text-3);line-height:1.45;font-weight:400}
  .choice.on .choice-sub{color:var(--brand);opacity:.75}

  .link-btn{padding:4px 2px;font:inherit;font-size:11px;color:var(--text-3);
    background:transparent;border:0;cursor:pointer;text-decoration:underline}
  .link-btn:hover{color:var(--brand)}

  .text-input{width:100%;box-sizing:border-box;padding:7px 10px;font:inherit;font-size:12.5px;
    line-height:1.6;color:var(--text);background:#fff;border:1px solid var(--border-2);
    border-radius:6px;outline:none;resize:vertical}
  .text-input:focus{border-color:var(--brand);box-shadow:0 0 0 2px rgba(59,125,216,.1)}

  .rank-row{display:flex;align-items:center;gap:8px;padding:6px 9px;margin-bottom:4px;
    background:#fff;border:1px solid var(--border-2);border-radius:6px;font-size:12.5px}
  .rank-row .no{flex:none;width:16px;color:var(--text-3);font-size:10px}
  .rank-row .txt{flex:1}

  .derive-row{display:flex;flex-wrap:wrap;gap:6px}
  .quick-task{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;
    font:inherit;font-size:12px;background:#fff;border:1px dashed var(--border-2);
    border-radius:6px;cursor:pointer}
  .quick-task:hover{border-style:solid;border-color:var(--brand);color:var(--brand)}
  .quick-task .code{font-size:10px;font-weight:700;color:var(--text-3);padding:0 4px;
    border-radius:3px;background:#f0f2f4}
  .quick-task .mode{font-size:9.5px;color:var(--text-3);margin-left:4px}

  .sec-desc{font-size:11px;color:var(--text-3);line-height:1.6;margin-top:5px}
  .muted{color:var(--text-3);font-style:italic}
  .req{color:var(--danger);font-weight:700}
  .unknown{border:1px dashed var(--border-2);border-radius:6px;background:#f7f8f9;
    padding:9px 11px;font-size:11.5px;color:var(--text-2)}
  .unknown pre{margin:5px 0 0;font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}

  /* ══════════════════════════════════════════════════════════
     选项卡（Ask / Multi）—— 照宿主那个 ask 的样式

     要点：没有圆点、没有方框。选中 = 整行加边框 + 淡蓝底。
     ══════════════════════════════════════════════════════════ */
  .oc{border:1px solid var(--border);border-radius:10px;background:#fff;
    padding:12px 14px 10px;margin-bottom:10px}
  .oc-head{margin-bottom:10px}
  .oc-sub{font-size:11px;color:var(--text-3);margin-bottom:4px}
  .oc-title{font-size:13.5px;color:var(--text);line-height:1.5;font-weight:400}

  .oc-list{display:flex;flex-direction:column;gap:5px}

  .oc-row{display:flex;align-items:baseline;gap:8px;width:100%;padding:7px 10px;
    font:inherit;font-size:12.5px;text-align:left;color:var(--text);
    background:#f7f8f9;border:1px solid transparent;border-radius:7px;
    cursor:pointer;transition:border-color .12s,background .12s}
  .oc-row:hover{background:#f1f3f5}
  .oc-row.on{background:#f4f8fe;border-color:var(--brand);color:var(--brand)}

  .oc-no{flex:none;width:16px;font-size:10px;font-weight:700;color:var(--text-3);
    text-align:center;line-height:1.6}
  .oc-row.on .oc-no{color:var(--brand)}
  .oc-label{flex:none;font-weight:600}
  .oc-rec{flex:none;font-size:9.5px;font-weight:700;color:var(--brand);
    background:rgba(59,125,216,.12);padding:0 5px;border-radius:3px;line-height:15px}
  .oc-desc{flex:1;min-width:0;font-size:11.5px;font-weight:400;color:var(--text-3);
    line-height:1.5}
  .oc-row.on .oc-desc{color:var(--brand);opacity:.8}

  /* 自己填的那行 —— 和普通选项同高同底色 */
  .oc-custom{align-items:center;cursor:default}
  .oc-custom:hover{background:#f7f8f9}
  .oc-input{flex:1;min-width:0;font:inherit;font-size:12.5px;color:var(--text);
    background:transparent;border:0;outline:none;padding:0}
  .oc-input::placeholder{color:var(--text-3)}

  /* 跳过 */
  .oc-skip{color:var(--text-3)}
  .oc-skip .oc-label{font-weight:400}
  .oc-skip.on{color:var(--brand)}
  .oc-skip.on .oc-label{font-weight:600}

  .oc-foot{margin-top:8px;font-size:10.5px;color:var(--text-3)}

  /* ══════════════════════════════════════════════════════════
     过滤栏 —— 横向展开

     收起  >状态<
     展开  >状态|进行|搁置|完成<
     二级  >状态|进行|搁置-需要信息/需要授权|完成<
     ══════════════════════════════════════════════════════════ */
  .filters{padding:9px 14px;border-bottom:1px solid var(--border)}
  .fb{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

  .fb-group{display:inline-flex;align-items:stretch;border:1px solid var(--border-2);
    border-radius:7px;overflow:hidden;background:#fff}
  .fb-group.open{border-color:var(--brand)}
  .fb-group.has{border-color:var(--brand);background:#f4f8fe}

  .fb-name{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;font:inherit;
    font-size:11.5px;color:var(--text-2);background:transparent;border:0;cursor:pointer;
    white-space:nowrap}
  .fb-name:hover{background:#f2f4f6}
  .fb-group.open .fb-name{color:var(--brand);font-weight:600;background:#eef3fb}
  .fb-chev{font-size:8px;opacity:.7}

  /* 展开后每一项一格，中间用竖线隔开 */
  .fb-item{display:inline-flex;align-items:center;border-left:1px solid var(--border);
    font-size:11.5px;white-space:nowrap}
  .fb-item-name{padding:4px 10px;color:var(--text-2);cursor:pointer;display:inline-block}
  .fb-item-name:hover{background:#f2f4f6;color:var(--text)}
  .fb-item.on > .fb-item-name{color:var(--brand);font-weight:600;background:#eef3fb}

  /* 子项：也是横向小格 */
  .fb-sub{padding:4px 8px;font:inherit;font-size:11px;color:var(--text-3);
    background:transparent;border:0;border-left:1px solid var(--border);cursor:pointer;
    white-space:nowrap}
  .fb-sub:hover{background:#f2f4f6;color:var(--text)}
  .fb-sub.on{color:var(--brand);font-weight:600;background:#eef3fb}

  .fb-clear{padding:4px 8px;font:inherit;font-size:11px;color:var(--text-3);
    background:transparent;border:0;cursor:pointer;text-decoration:underline}
  .fb-clear:hover{color:var(--danger)}

  /* 卡片头：灰色小字 + 右边的「跳过」 */
  .oc-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .oc-sub{font-size:11px;color:var(--text-3)}
  .oc-spacer{flex:1}
  .oc-skipbtn{padding:2px 9px;font:inherit;font-size:10.5px;color:var(--text-3);
    background:#fff;border:1px solid var(--border-2);border-radius:12px;cursor:pointer;
    white-space:nowrap}
  .oc-skipbtn:hover{border-color:#b9bdc2;color:var(--text)}
  .oc-skipbtn.on{background:#eef3fb;border-color:var(--brand);color:var(--brand);font-weight:600}

  /* 采纳后图标变灰 */
  .icon-btn.off{opacity:.3;cursor:not-allowed}
  .icon-btn.off:hover{background:transparent}

  /* 元的推导态菜单 */
  .goal-menu{width:290px}
  .goal-row{display:flex;align-items:flex-start;gap:7px;padding:6px 9px;border-radius:5px;
    font-size:12px;color:var(--text-2);line-height:1.5}
  .goal-row.on{background:#eef3fb;color:var(--brand);font-weight:600}
  .goal-mark{flex:none;font-size:8px;margin-top:5px}
  .goal-body{display:flex;flex-direction:column;gap:1px;min-width:0}
  .goal-name{font-size:12px}
  .goal-why{font-size:10.5px;color:var(--text-3);font-weight:400}
  .goal-row.on .goal-why{color:var(--brand);opacity:.75}

  /* 元数据表 */
  .d-meta-block{padding:8px 15px 10px;border-bottom:1px solid var(--border);
    display:flex;flex-direction:column;gap:3px;flex:none}
  .d-meta-row{display:flex;gap:8px;font-size:11.5px;line-height:1.6}

/* ══════════════════════════════════════════════════════════════
   数据层 —— 走服务端 API，落盘到文件

   ## 为什么不用 localStorage

   收件箱是「用户写，AI 读」的通道。localStorage 只活在浏览器里，
   AI 读不到；下载文件又要用户多点几次。

   所以起一个极小的本机服务（server.mjs），页面直接 POST，服务端写文件。

   ## 两个页面两份数据

     收件箱 → /api/inbox → 收件箱.json
     工作区 → /api/work  → 工作区.json

   完全隔离：工作区那边格式随时会变，不能牵连收件箱。
   ══════════════════════════════════════════════════════════════ */

/** 服务端路径前缀，由 build 脚本按页面替换。 */
const API = '/api/work';

let DB = [];
let saveTimer = null;
let dirty = false;

/** 从服务端读。 */
async function loadFromServer() {
  try {
    const response = await fetch(API);
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const payload = await response.json();
    DB = Array.isArray(payload.items) ? payload.items : [];
    if (DB.length === 0) DB = JSON.parse(JSON.stringify(TASKS));
    return true;
  } catch (failure) {
    /* 服务没起（比如直接双击 HTML）：退回内置样本，并提示 */
    DB = JSON.parse(JSON.stringify(TASKS));
    setSyncState('本地模式（服务未连接，改动只在这个页面里）', true);
    return false;
  }
}

/** 写回服务端（防抖 600ms，避免每敲一个字都发请求）。 */
function scheduleSave() {
  dirty = true;
  setSyncState('有未保存的改动…', false);
  if (saveTimer !== null) clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 600);
}

async function flushSave() {
  saveTimer = null;
  if (!dirty) return;
  dirty = false;
  try {
    const response = await fetch(API, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ items: DB })
    });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    setSyncState('已保存 · ' + new Date().toLocaleTimeString('zh-CN'), false);
  } catch (failure) {
    setSyncState('保存失败：' + failure.message, true);
  }
}

function setSyncState(text, isError) {
  const box = document.getElementById('syncState');
  if (!box) return;
  box.textContent = text;
  box.style.color = isError ? 'var(--danger)' : 'var(--work)';
}

/* ── 编号规则（和宿主一致）──
   有模板 → 用模板编号（GU / WI / DP…）
   空模板 → 用类别字母（G / D / R / W） */
const KIND_PREFIX = { goal: 'G', design: 'D', record: 'R', work: 'W' };

function nextId(type, kind) {
  const t = String(type || '').toUpperCase();
  const prefix = t !== '' ? t : (KIND_PREFIX[kind] || 'X');
  const pattern = new RegExp('^' + prefix + '-(\\d+)$');
  let max = 0;
  for (const item of DB) {
    const m = pattern.exec(item.id);
    if (m !== null) max = Math.max(max, Number(m[1]));
  }
  return prefix + '-' + String(max + 1).padStart(2, '0');
}

/* ── 条目编辑 ── */

function patchTask(id, patch) {
  const i = DB.findIndex((t) => t.id === id);
  if (i < 0) return;
  DB[i] = Object.assign({}, DB[i], patch);
  scheduleSave();
  renderAll();
}

function createTask(init) {
  const type = init.type || '';
  const kind = init.kind || 'goal';
  const task = {
    id: nextId(type, kind),
    title: init.title || '未命名',
    type,
    kind,
    status: '未指定',
    parent: init.parent || '',
    links: '',
    tags: [],
    body: init.body || '',
    note: '',
    workspace: init.workspace || '',
    workspaces: init.workspaces || '',
    tmpWorkspace: init.tmpWorkspace || '',
    permission: init.permission || '',
    deny: init.deny || '',
    tags: init.tags ? String(init.tags).split(',').map((x) => x.trim()).filter(Boolean) : []
  };
  DB.push(task);
  scheduleSave();
  state.selected = task.id;
  renderAll();
  return task.id;
}

function deleteTask(id) {
  const ids = new Set([id]);
  let grew = true;
  while (grew) {
    grew = false;
    for (const t of DB) {
      if (t.parent && ids.has(t.parent) && !ids.has(t.id)) { ids.add(t.id); grew = true; }
    }
  }
  DB = DB.filter((t) => !ids.has(t.id));
  scheduleSave();
  if (ids.has(state.selected)) state.selected = DB[0] ? DB[0].id : '';
  renderAll();
}

function resetDB() {
  DB = JSON.parse(JSON.stringify(TASKS));
  scheduleSave();
  state.selected = DB[0] ? DB[0].id : '';
  renderAll();
}

/* ── 底部自由文本 ── */

let draftTimer = null;

async function loadDraft() {
  const ta = document.getElementById('draft');
  if (!ta) return;
  try {
    const response = await fetch(API + '/draft');
    if (response.ok) {
      const payload = await response.json();
      ta.value = payload.text || '';
    }
  } catch (failure) {
    /* 服务没起就留空 */
  }
  updateHint();
  ta.addEventListener('input', () => {
    updateHint();
    if (draftTimer !== null) clearTimeout(draftTimer);
    draftTimer = setTimeout(saveDraft, 700);
  });
}

async function saveDraft() {
  draftTimer = null;
  const ta = document.getElementById('draft');
  if (!ta) return;
  try {
    await fetch(API + '/draft', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text: ta.value })
    });
    updateHint();
  } catch (failure) {
    /* 静默失败：底部提示已经够多了 */
  }
}

function updateHint() {
  const ta = document.getElementById('draft');
  const box = document.getElementById('saveHint');
  if (!ta || !box) return;
  box.textContent = ta.value.trim() === ''
    ? '空'
    : (ta.value.length + ' 字 · ' + new Date().toLocaleTimeString('zh-CN'));
  box.className = ta.value.trim() === '' ? '' : 'saved';
}

/**

 * @param {string} type 模板编号

function sectionsOf(type) {

  return rows.map(function (row) {
    return {
      id: row[0],
      label: row[1],
      action: row[2],
      placeholder: row[3] || '',
      required: row[4] === true
    };
  });
}

 * 新建时用它给用户看「选了这个模板，正文会问你要哪些东西」。
 *
 * @param {string} type
 * @returns {string[]}
 */
function actionsOf(type) {
  const out = [];
  for (const s of sectionsOf(type)) {
    if (s.action && !out.includes(s.action)) out.push(s.action);
  }
  return out;
}

];

/** 取关系类型的颜色（认不出就用「相关」那档）。 */
function linkColor(kind) {
  const found = LINK_KINDS.find((x) => x.key === kind);
  return found ? found.color : '#8a9099';
}



/* ══════════════════════════════════════════════════════════════
   科技树 —— 把事项铺成分层有向图

   真实插件用 dagre（Sugiyama）。这里写简化版：按依赖深度分列，
   层内按父节点行号排序。10~30 个节点看不出差别。

   边的方向一律归一成「先决 → 依赖方」：
     父 → 子 / 依赖:它 → 我 / 派生:我 → 它 / 来源:它 → 我
   ══════════════════════════════════════════════════════════════ */
const TREE_NODE_W = 150;
const TREE_NODE_H = 50;
const TREE_GAP_X = 62;
const TREE_GAP_Y = 16;

/** 解析 links 字符串：`依赖:WI-01, 派生:DP-02` */
function parseLinks(raw) {
  const text = String(raw || '').trim();
  if (text === '') return [];
  const out = [];
  for (const part of text.split(',')) {
    const piece = part.trim();
    if (piece === '') continue;
    const cut = piece.indexOf(':');
    if (cut < 0) out.push({ label: '相关', to: piece });
    else out.push({ label: piece.slice(0, cut).trim() || '相关', to: piece.slice(cut + 1).trim() });
  }
  return out.filter((link) => link.to !== '');
}

function buildTree(tasks) {
  const byId = {};
  for (const t of tasks) byId[t.id] = t;

  const edges = [];
  const seen = new Set();
  const addEdge = (src, dst, kind, label) => {
    if (src === dst || !byId[src] || !byId[dst]) return;
    /* 去重键带上 kind：父子边和「来源」边指向同一对节点但语义不同，
       以前只按 id 对去重，先加的父子边把来源边吞掉了。 */
    const pair = src < dst ? src + '\u0000' + dst : dst + '\u0000' + src;
    const key = pair + '\u0000' + kind + '\u0000' + (label || '');
    if (seen.has(key)) return;
    seen.add(key);
    edges.push({ src, dst, kind, label });
  };

  for (const t of tasks) {
    if (t.parent) addEdge(t.parent, t.id, 'parent', 'parent');
    for (const link of parseLinks(t.links)) {
      if (link.label === '派生') addEdge(t.id, link.to, 'link', link.label);
      else addEdge(link.to, t.id, 'link', link.label);
    }
  }

  /* 分层：最长路径深度，最多 N 轮（防环） */
  const depth = {};
  for (const t of tasks) depth[t.id] = 0;
  for (let round = 0; round < tasks.length; round++) {
    let changed = false;
    for (const edge of edges) {
      const want = depth[edge.src] + 1;
      if (depth[edge.dst] < want) { depth[edge.dst] = want; changed = true; }
    }
    if (!changed) break;
  }

  const layers = [];
  for (const t of tasks) {
    const d = depth[t.id];
    if (!layers[d]) layers[d] = [];
    layers[d].push(t);
  }
  const live = layers.filter((l) => Array.isArray(l) && l.length > 0);

  const placed = {};
  const nodes = [];
  let maxRows = 0;

  live.forEach((layer, col) => {
    layer.sort((a, b) => {
      const pa = a.parent && placed[a.parent] ? placed[a.parent].row : 999;
      const pb = b.parent && placed[b.parent] ? placed[b.parent].row : 999;
      if (pa !== pb) return pa - pb;
      return a.id < b.id ? -1 : 1;
    });
    layer.forEach((t, row) => {
      const x = col * (TREE_NODE_W + TREE_GAP_X);
      const y = row * (TREE_NODE_H + TREE_GAP_Y);
      placed[t.id] = { node: t, x, y, row, col };
      nodes.push(placed[t.id]);
    });
    maxRows = Math.max(maxRows, layer.length);
  });

  return {
    nodes,
    edges: edges.filter((edge) => placed[edge.src] && placed[edge.dst]),
    placed,
    width: live.length === 0 ? 0 : live.length * (TREE_NODE_W + TREE_GAP_X) - TREE_GAP_X,
    height: maxRows === 0 ? 0 : maxRows * (TREE_NODE_H + TREE_GAP_Y) - TREE_GAP_Y
  };
}

function renderTree(box, tasks) {
  box.innerHTML = '';
  if (tasks.length === 0) {
    box.appendChild(el('div', {class:'tree-empty'}, '这个筛选下没有事项。'));
    return;
  }

  const tree = buildTree(tasks);
  const canvas = el('div', {class:'tree-canvas', style:{
    width: (tree.width + 20) + 'px',
    height: (tree.height + 20) + 'px'
  }});

  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('width', String(tree.width + 20));
  svg.setAttribute('height', String(tree.height + 20));
  svg.style.position = 'absolute';
  svg.style.left = '0';
  svg.style.top = '0';
  svg.style.pointerEvents = 'none';

  const defs = document.createElementNS(ns, 'defs');
  const marker = document.createElementNS(ns, 'marker');
  marker.setAttribute('id', 'tree-arrow');
  marker.setAttribute('viewBox', '0 0 8 8');
  marker.setAttribute('refX', '7');
  marker.setAttribute('refY', '4');
  marker.setAttribute('markerWidth', '7');
  marker.setAttribute('markerHeight', '7');
  marker.setAttribute('orient', 'auto');
  const arrowPath = document.createElementNS(ns, 'path');
  arrowPath.setAttribute('d', 'M0 0 L8 4 L0 8 Z');
  arrowPath.setAttribute('fill', 'var(--border-2)');
  marker.appendChild(arrowPath);
  defs.appendChild(marker);
  svg.appendChild(defs);

  /* 同一对节点的多条边（父子 + 来源 + 派生）会画成完全重叠的曲线，
     看不出是几条。这里按同对出现的序号各自错开一点。 */
  const pairSeen = new Map();
  for (const edge of tree.edges) {
    const pairKey = edge.src < edge.dst ? edge.src + '|' + edge.dst : edge.dst + '|' + edge.src;
    const index = pairSeen.get(pairKey) ?? 0;
    pairSeen.set(pairKey, index + 1);

    const from = tree.placed[edge.src];
    const to = tree.placed[edge.dst];
    const x1 = from.x + TREE_NODE_W;
    const y1 = from.y + TREE_NODE_H / 2;
    const x2 = to.x - 6;
    const y2 = to.y + TREE_NODE_H / 2;
    const dx = Math.max(24, Math.abs(x2 - x1) / 2);
    /* 第 0 条走中间，第 1 条往上弯、第 2 条往下弯 */
    const bow = index === 0 ? 0 : (index % 2 === 1 ? -1 : 1) * (18 + Math.floor(index / 2) * 12);
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', 'M' + x1 + ' ' + y1
      + ' C' + (x1 + dx) + ' ' + (y1 + bow) + ' ' + (x2 - dx) + ' ' + (y2 + bow) + ' ' + x2 + ' ' + y2);
    path.setAttribute('fill', 'none');
    /*
     * 选中某条时，和它相连的箭头要突出显示。
     *
     * 用户原话：
     *   > 点击卡片选中卡片的时候。这个卡片的关联箭头没有突出显示。
     *
     * 所以：相连的加粗 + 不透明，不相连的压暗。
     */
    const linked = state.selected !== '' && (edge.src === state.selected || edge.dst === state.selected);
    const dimmed = state.selected !== '' && !linked;

    path.setAttribute('stroke', linkColor(edge.label || edge.kind));
    path.setAttribute('opacity', dimmed ? '0.12' : (linked ? '1' : '0.55'));
    path.setAttribute('stroke-width', linked ? '2.6' : (edge.kind === 'parent' ? '1.2' : '1.5'));
    {
      const spec = LINK_KINDS.find((x) => x.key === (edge.label || edge.kind));
      if (spec && spec.dashed) path.setAttribute('stroke-dasharray', '4 3');
    }
    path.setAttribute('marker-end', 'url(#tree-arrow)');
    svg.appendChild(path);
  }
  canvas.appendChild(svg);

  for (const placed of tree.nodes) {
    const t = placed.node;
    const color = KIND_COLOR[t.kind] || 'var(--text-3)';
    canvas.appendChild(el('div', {
      class: 'tree-node' + (t.id === state.selected ? ' on' : ''),
      style: { left: (placed.x + 10) + 'px', top: (placed.y + 10) + 'px' },
      onclick() {
        state.selected = t.id;
        state.menuOpen = false;
        state.relOpen = false;
        renderAll();
      }
    },
      el('div', {class:'top'},
        el('span', {class:'tid', style:{color}}, t.id),
        el('span', {class:'tk', style:{color}}, KIND_LABEL[t.kind] || t.kind),
        /* 领域：只写在类别后面。用户原话：
           > 科技树模式下，目标的 label 后面还要放领域的 label。 */
        el('span', {class:'tk', style:{color, opacity:'0.65'}}, DOMAIN_LABEL[domainOf(t)] || domainOf(t)),
        el('span', {style:{marginLeft:'auto', color:toneOf(t.status), fontSize:'8px'}}, '●')),
      el('div', {class:'tt'}, t.title)));
  }

  box.appendChild(canvas);
}

/* ══════════════════════════════════════════════════════════════
   正文渲染 —— 按 action 分发（演示渲染器机制）
   ══════════════════════════════════════════════════════════════ */

/* 极简 Markdown → HTML。只处理快照里用得到的几种语法：
   标题、无序/有序列表、粗体、行内代码、引用、分割线、表格。 */
function md(source) {
  const text = String(source || '');
  const lines = text.split(/\r?\n/);
  const out = [];
  let inList = null;
  const inline = (s) => s
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  const flushList = () => { if (inList) { out.push('</' + inList + '>'); inList = null; } };
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  for (let i = 0; i < lines.length; i += 1) {
    const raw = lines[i];
    const line = raw.trimEnd();

    /* 围栏代码块：```lang ... ``` */
    if (/^```/.test(line.trim())) {
      flushList();
      const lang = line.trim().slice(3).trim();
      const body = [];
      i += 1;
      while (i < lines.length && !/^```/.test(lines[i].trim())) {
        body.push(lines[i]);
        i += 1;
      }
      out.push('<pre class="code"><code' + (lang ? ' data-lang="' + esc(lang) + '"' : '') + '>'
        + esc(body.join('\n')) + '</code></pre>');
      continue;
    }

    /* 缩进代码块：连续 4 空格开头的行（表格/列表之后才算） */
    if (/^ {4}\S/.test(raw) && inList === null) {
      /* 先看它上面是不是空行或上一行也是缩进 —— 简单点：整段连续缩进行当一个块 */
      const body = [line.slice(4)];
      while (i + 1 < lines.length && (/^ {4}\S/.test(lines[i + 1]) || lines[i + 1].trim() === '')) {
        i += 1;
        body.push(lines[i].trim() === '' ? '' : lines[i].slice(4));
      }
      /* 去掉尾部空行 */
      while (body.length > 0 && body[body.length - 1] === '') body.pop();
      out.push('<pre class="code"><code>' + esc(body.join('\n')) + '</code></pre>');
      continue;
    }

    if (line.trim() === '') { flushList(); continue; }

    /* 表格：表头 + |---| + 数据行 */
    if (/^\|.*\|$/.test(line.trim())) {
      const next = lines[i + 1] ? lines[i + 1].trim() : '';
      if (/^\|[\s:|-]+\|?$/.test(next)) {
        flushList();
        const cells = (row) => row.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
        out.push('<table><thead><tr>' + cells(line).map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>');
        i += 2;
        while (i < lines.length && /^\|.*\|$/.test(lines[i].trim())) {
          out.push('<tr>' + cells(lines[i]).map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>');
          i += 1;
        }
        out.push('</tbody></table>');
        i -= 1;
        continue;
      }
    }

    const h = /^(#{1,4})\s+(.*)$/.exec(line);
    if (h) { flushList(); const lv = h[1].length + 2; out.push('<h' + lv + '>' + inline(h[2]) + '</h' + lv + '>'); continue; }
    if (/^---+$/.test(line.trim())) { flushList(); out.push('<hr>'); continue; }
    const q = /^>\s?(.*)$/.exec(line);
    if (q) { flushList(); out.push('<blockquote>' + inline(q[1]) + '</blockquote>'); continue; }
    const ul = /^\s*[-*]\s+(.*)$/.exec(line);
    if (ul) { if (inList !== 'ul') { flushList(); out.push('<ul>'); inList = 'ul'; } out.push('<li>' + inline(ul[1]) + '</li>'); continue; }
    const ol = /^\s*\d+\.\s+(.*)$/.exec(line);
    if (ol) { if (inList !== 'ol') { flushList(); out.push('<ol>'); inList = 'ol'; } out.push('<li>' + inline(ol[1]) + '</li>'); continue; }

    flushList();
    out.push('<p>' + inline(line) + '</p>');
  }
  flushList();
  return out.join('');
}
