  relOpen: false
};

/** 按 id 取一条（内存里的，不是磁盘）。 */
function taskOf(id) {
  return DB.find((x) => x.id === id);
}


/* ══════════════════════════════════════════════════════════════
   编译器层 —— 参数（json）→ mdx 字符串

   ## 管道

   用户原话：

     > 参数就是 .cs。然后渲染器给 mdx 就是 IL。
     > 最后外部渲染器渲染 mdx，就是 .net。

   对照：

     .cs 源码    →  参数（JSON）
     IL          →  mdx
     CLR         →  外部渲染器
     程序集/BCL  →  组件库（Ask / Rank / …）
     编译器      →  **本文件**

   ## 每个行动两个方向

     form(schema)   创建时：画控件，让用户填 → 产出 json
     render(json)   展示时：json → mdx

   ## 唯一的安全边界

   参数**只当字面量**嵌入，走 `JSON.stringify`：

     对：`<Ask case={${JSON.stringify(raw.case)}} />`
     错：`<Ask case={[${raw.case.join(',')}]} />`

   第二种会让参数里长得像代码的字符串变成真代码。

   这不是安全检查，是**类型保证**：schema 说 string，它就只能是 string。

   ## 为什么渲染器不碰 React

   它只生成文本。所以可以跑在宿主侧（Node），也可以在浏览器里。
   真正把 mdx 变成界面的是外部渲染器（见 mdx-runtime.js）。
   ══════════════════════════════════════════════════════════════ */

/**
 * 把一个值编成 mdx 表达式里的**字面量**。
 *
 * @param {unknown} value
 * @returns {string}
 */
function lit(value) {
  return JSON.stringify(value === undefined ? null : value);
}

/**
 * 编一个属性。值是字符串就走 `"..."`，其它走 `{...}`。
 *
 * @param {string} name
 * @param {unknown} value
 * @returns {string}
 */
function attr(name, value) {
  if (value === undefined || value === null || value === '') return '';
  if (typeof value === 'string') return ' ' + name + '=' + lit(value);
  if (typeof value === 'number') return ' ' + name + '={' + String(value) + '}';
  if (typeof value === 'boolean') return ' ' + name + '={' + String(value) + '}';
  return ' ' + name + '={' + lit(value) + '}';
}

/* ══════════════════════════════════════════════════════════════
   五个行动的编译器
   ══════════════════════════════════════════════════════════════ */

/**
 * text —— 一段可输入的文本。
 *
 * @param {object} raw
 * @returns {string}
 */
function compileText(raw) {
  const row = Number(raw.row) > 0 ? Number(raw.row) : 3;
  return '<Text'
    + attr('value', String(raw.value || ''))
    + attr('row', row)
    + attr('placeholder', raw.placeholder)
    + attr('label', raw.label)
    + attr('description', raw.description)
    + attr('required', raw.required === true ? true : undefined)
    + ' />';
}

/**
 * markdown —— 只读富文本。
 *
 * @param {object} raw
 * @returns {string}
 */
function compileMarkdown(raw) {
  return '<Markdown'
    + attr('value', String(raw.value || ''))
    + attr('placeholder', raw.placeholder)
    + attr('label', raw.label)
    + ' />';
}

/**
 * 把 options 归一成 { label, description, recommended }。
 *
 * 兼容两种旧写法：
 *   'A'                             纯字符串
 *   { title: 'A', placeholder: 'x' } 旧字段名
 *
 * @param {unknown} options
 * @returns {Array<{label: string, description: string, recommended: boolean}>}
 */
function normalizeOptions(options) {
  if (!Array.isArray(options)) return [];
  return options.map(function (o) {
    if (typeof o === 'string') return { label: o, description: '', recommended: false };
    return {
      label: String(o.label || o.title || ''),
      description: String(o.description || o.placeholder || ''),
      recommended: o.recommended === true
    };
  });
}

/**
 * ask —— 单选或多选，同一个行为。
 *
 * multi: true 时用 picked_multi（数组），否则用 picked（字符串）。
 *
 * @param {object} raw
 * @returns {string}
 */
function compileAsk(raw) {
  const options = normalizeOptions(raw.options);
  const multi = raw.multi === true;

  /* 单选支持 picked，多选支持 picked_multi；两个都给时按 multi 取 */
  /*
   * 默认 '未选择'（没看这张卡片）。
   *
   * 用户原话：
   *   > "未选择"，应该是默认选择，并且点击才激活。
   *   > 然后未选择，应该改名为"未选择"
   */
  const single = String(raw.picked === undefined || raw.picked === null ? '未选择' : raw.picked);
  const list = Array.isArray(raw.picked_multi)
    ? raw.picked_multi.map(String)
    : (Array.isArray(raw.picked) ? raw.picked.map(String) : []);

  return '<Ask'
    + attr('header', raw.header)
    + attr('question', raw.question)
    + attr('options', options)
    + attr('multi', multi ? true : undefined)
    + attr('picked', multi ? undefined : single)
    + attr('pickedMulti', multi ? list : undefined)
    + attr('allowCustom', raw.allow_custom === false ? false : true)
    + attr('placeholder', raw.placeholder)
    + attr('label', raw.label)
    + attr('description', raw.description)
    + attr('required', raw.required === true ? true : undefined)
    + ' />';
}

/**
 * rank —— 排先后顺序。
 *
 * @param {object} raw
 * @returns {string}
 */
function compileRank(raw) {
  const items = Array.isArray(raw.items)
    ? raw.items.map(function (o) {
        if (typeof o === 'string') return { title: o, placeholder: '' };
        return { title: String(o.title || ''), placeholder: String(o.placeholder || '') };
      })
    : [];

  return '<Rank'
    + attr('items', items)
    + attr('placeholder', raw.placeholder)
    + attr('label', raw.label)
    + attr('description', raw.description)
    + ' />';
}

/**
 * derive —— 从这一条派生子任务。
 *
 * @param {object} raw
 * @returns {string}
 */
function compileDerive(raw) {
  const templates = Array.isArray(raw.templates) ? raw.templates.map(String) : [];
  return '<Derive'
    + attr('templates', templates)
    + attr('mode', String(raw.mode || 'ask'))
    + attr('placeholder', raw.placeholder)
    + attr('label', raw.label)
    + attr('description', raw.description)
    + ' />';
}

/* ══════════════════════════════════════════════════════════════
   注册表
   ══════════════════════════════════════════════════════════════ */

/** 行为名 → 编译器。 */
const ACTION_COMPILERS = {
  text: compileText,
  markdown: compileMarkdown,
  ask: compileAsk,
  rank: compileRank,
  derive: compileDerive
};

/** 别名：旧模板还在用这些名字。 */
const COMPILER_ALIASES = { textarea: 'text', input: 'text', choose: 'ask', multi: 'ask' };

/**
 * 编译一章。
 *
 * @param {string} key   章节 id
 * @param {object} raw   这一章的值
 * @returns {string} mdx 片段；不认识的行为返回灰卡
 */
function compileSection(key, raw) {
  if (raw === null || typeof raw !== 'object') return '';

  const given = String(raw.action || raw.type || '').trim();
  if (given === '') return '';

  const action = COMPILER_ALIASES[given] || given;
  const compile = ACTION_COMPILERS[action];

  if (compile === undefined) {
    /* 不认识这个行为：输出一个灰卡组件。
       外部渲染器如果也不认识 Unknown，它自己会兜底。 */
    return '<Unknown name=' + lit(given) + ' value={' + lit(raw) + '} />';
  }

  return compile(raw);
}

/**
 * 把旧的字符串正文（`## 标题\n内容`）编译成 mdx。
 *
 * ## 为什么不能整段当一个 Markdown
 *
 * 旧正文是：
 *
 *     ## 要定什么
 *
 *     不同模板前缀是否各自独立流水。
 *
 *     ## 选项
 *
 *     - WF-01 和 GU-01 各自从 01 开始
 *     - 全部共用一个流水号
 *
 * 如果整段包成一个 <Markdown>，**章节结构全丢了** ——
 * 「选项」这章本该是 ask，结果变成一段文字。
 *
 * 所以：按 `## ` 切开，拿标题去章节表里查它是什么行为，
 * 再用那个行为编译。
 *
 * ## 标题对不上时
 *
 * 归给 `other` 那一章的行为（通常是 text）。
 * 还不行就当 markdown。
 *
 * @param {object} task
 * @param {string} body
 * @returns {string}
 */
function compileLegacyString(task, body) {
  const sections = sectionsOf(task.type);

  /* 按 `## 标题` 切段 */
  const chunks = [];
  let current = null;
  for (const line of String(body).split(/\r?\n/u)) {
    const m = /^##\s+(.+)$/u.exec(line);
    if (m !== null) {
      if (current !== null) chunks.push(current);
      current = { title: m[1].trim(), lines: [] };
      continue;
    }
    if (current === null) continue;
    current.lines.push(line);
  }
  if (current !== null) chunks.push(current);

  /* 一个 ## 都没有：整段当一个 Markdown */
  if (chunks.length === 0) {
    return '<Markdown value=' + lit(body) + ' />';
  }

  const parts = [];
  for (const chunk of chunks) {
    const text = chunk.lines.join('\n').trim();

    /* 拿标题去章节表里查 —— 按 label 或 id 都认 */
    const section = sections.find(function (s) {
      return s.label === chunk.title || s.id === chunk.title;
    });

    /* 查不到这个标题 = 旧数据里的自由分节。
       这种内容只能当**只读展示** —— 我们不知道它该填什么，也不能编一个输入框出来。
       所以降级成 markdown，不是 text。 */
    const action = section ? section.action : 'markdown';

    const raw = { action: action, value: text, label: chunk.title };
    /* 章节表里有 placeholder 就带上 */
    if (section && section.placeholder) raw.placeholder = section.placeholder;

    /* ask / rank / derive 这类要结构的，旧数据里没有 —— 降级成 markdown。
       标题放到 label 上（由外部渲染器画），value 里不留 ##。 */
    if (action === 'ask' || action === 'rank' || action === 'derive') {
      parts.push('<Markdown value=' + lit(text) + ' label=' + lit(chunk.title) + ' />');
      continue;
    }

    parts.push(compileSection(section ? section.id : chunk.title, raw));
  }
  return parts.join('\n');
}

/**
 * 编译整份正文。
 *
 * @param {object} task
 * @returns {string} mdx
 */
function compileBody(task) {
  const body = task.body;

  /* 旧格式字符串：按 `## 标题` 切开，每段按章节表匹配它的行为 */
  if (typeof body === 'string') {
    if (body.trim() === '') return '';
    return compileLegacyString(task, body);
  }

  if (body === null || typeof body !== 'object') return '';

  /* 按模板章节顺序；模板里没有的键排后面 */
  const sections = sectionsOf(task.type);
  const order = [];
  for (const s of sections) {
    if (body[s.id] !== undefined) order.push([s.id, body[s.id]]);
  }
  for (const [key, value] of Object.entries(body)) {
    if (!sections.some((s) => s.id === key)) order.push([key, value]);
  }

  const parts = [];
  for (const [key, raw] of order) {
    const mdx = compileSection(key, raw);
    if (mdx !== '') parts.push(mdx);
  }
  return parts.join('\n');
}


/* ══════════════════════════════════════════════════════════════
   外部渲染器 —— mdx 字符串 → 真正的界面

   ## 在管道里的位置

     参数（json）
        ↓  compiler.js
     mdx 字符串
        ↓  **本文件**
     DOM + 行为

   用户原话：

      > 最后外部渲染器渲染 mdx，就是 .net。

   ## 为什么这里不接 @mdx-js/mdx

   真实的包是 `@mdx-js/mdx` + `@mdx-js/react`（见 RR-10）。

   沙盘是两份独立的静态 HTML，不打包、不带 node_modules。
   所以这里实现一个**子集编译器**，只认我们自己编译器产出的那几种形状：

     <Text value="…" row={3} placeholder="…" />
     <Ask options={[{…}]} picked="…" />
     <Markdown value="…" />
     <Rank items={[{…}]} />
     <Derive templates={["WR"]} mode="ask" />
     <Unknown name="…" value={{…}} />

   这不是「另一种 mdx」，是 mdx 的受限子集 —— 解析规则和真 mdx 一致
   （标签、字符串属性、`{}` 表达式），只是表达式只允许字面量。

   ## 换成真包要改什么

   只改 `renderMdx()` 这一个函数：

     const { default: Content } = await evaluate(mdx, {
       ...runtime,
       useMDXComponents: () => COMPONENTS,
     });
     return Content;

   组件表（COMPONENTS）原样可用。
   ══════════════════════════════════════════════════════════════ */

/**
 * 解析一个 mdx 属性串。
 *
 * 支持三种形态：
 *   name="字符串"
 *   name={字面量}
 *   name
 *
 * @param {string} source
 * @returns {Record<string, unknown>}
 */
function parseAttrs(source) {
  const out = {};
  let i = 0;

  while (i < source.length) {
    /* 跳过空白 */
    while (i < source.length && /\s/u.test(source[i])) i += 1;
    if (i >= source.length) break;

    /* 属性名 */
    const nameStart = i;
    while (i < source.length && /[A-Za-z_$]/u.test(source[i])) i += 1;
    const name = source.slice(nameStart, i);
    if (name === '') { i += 1; continue; }

    /* 等号 */
    while (i < source.length && /\s/u.test(source[i])) i += 1;
    if (source[i] !== '=') {
      out[name] = true;
      continue;
    }
    i += 1;
    while (i < source.length && /\s/u.test(source[i])) i += 1;

    if (source[i] === '"' || source[i] === "'") {
      /* 字符串字面量。
         注意：**只认起始那个引号**，中途出现的 ' 和 ` 都是普通字符。
         以前是遇到任何引号都当边界，导致 `console.log('x')` 被截断。 */
      const quote = source[i];
      i += 1;
      let text = '';
      while (i < source.length && source[i] !== quote) {
        /* 同类引号才结束 —— 其它引号是内容 */
        if (source[i] === '\\') {
          /* 还原转义：\\n → 换行，\\t → tab，\\" → 引号 */
          const next = source[i + 1];
          if (next === 'n') text += '\n';
          else if (next === 't') text += '\t';
          else if (next === 'r') text += '\r';
          else text += next;
          i += 2;
          continue;
        }
        text += source[i];
        i += 1;
      }
      i += 1;
      out[name] = text;
      continue;
    }

    if (source[i] === '{') {
      /* 表达式：只吃一个平衡的 {...}，然后按字面量求值 */
      const start = i;
      let depth = 0;
      let inStr = null;
      while (i < source.length) {
        const c = source[i];
        if (inStr !== null) {
          if (c === '\\') { i += 2; continue; }
          if (c === inStr) inStr = null;
          i += 1;
          continue;
        }
        if (c === '"' || c === "'") { inStr = c; i += 1; continue; }
        if (c === '{') depth += 1;
        else if (c === '}') {
          depth -= 1;
          if (depth === 0) { i += 1; break; }
        }
        i += 1;
      }
      const expr = source.slice(start + 1, i - 1);
      out[name] = evalLiteral(expr);
      continue;
    }

    /* 其它：跳到下一个空白 */
    const skipStart = i;
    while (i < source.length && !/\s/u.test(source[i])) i += 1;
    out[name] = source.slice(skipStart, i);
  }

  return out;
}

/**
 * 求值一个「只允许字面量」的表达式。
 *
 * 不 eval。只认 JSON 能表达的形态（字符串、数字、布尔、数组、对象）。
 * 认不出就原样返回字符串 —— 这样参数里的代码永远不会被执行。
 *
 * @param {string} expr
 * @returns {unknown}
 */
function evalLiteral(expr) {
  const text = expr.trim();
  if (text === '') return null;
  try {
    return JSON.parse(text);
  } catch {
    /* 不是 JSON：可能是 true / false / null 之外的裸词，原样当字符串 */
    if (text === 'true') return true;
    if (text === 'false') return false;
    if (text === 'null') return null;
    return text;
  }
}

/**
 * 把一个自闭合标签（或成对标签）解析出来。
 *
 * @param {string} source
 * @returns {Array<{name: string, attrs: object}>}
 */
function parseTags(source) {
  const out = [];
  const text = String(source);
  let i = 0;

  while (i < text.length) {
    /* 找一个 < 后面紧跟大写字母的位置 */
    if (text[i] !== '<' || !/[A-Z]/u.test(text[i + 1] || '')) { i += 1; continue; }

    /* 标签名 */
    const nameStart = i + 1;
    let j = nameStart;
    while (j < text.length && /[A-Za-z0-9]/u.test(text[j])) j += 1;
    const name = text.slice(nameStart, j);

    /* 扫属性，直到真正的 > */
    const attrStart = j;
    let depth = 0;
    let quote = null;
    let closed = -1;
    for (; j < text.length; j += 1) {
      const c = text[j];
      if (quote !== null) {
        if (c === '\\') { j += 1; continue; }
        if (c === quote) quote = null;
        continue;
      }
      if (c === '"' || c === "'") { quote = c; continue; }
      if (c === '{') { depth += 1; continue; }
      if (c === '}') { depth -= 1; continue; }
      /* 只有在 {} 外面、引号外面的 > 才是标签结束 */
      if (c === '>' && depth === 0) { closed = j; break; }
    }

    if (closed < 0) break;

    const attrText = text.slice(attrStart, closed).replace(/\/\s*$/u, '');
    out.push({ name, attrs: parseAttrs(attrText) });
    i = closed + 1;
  }

  return out;
}

/* ══════════════════════════════════════════════════════════════
   组件表

   这就是「程序集」—— mdx 里的 <Ask> 对应这里的 Ask。
   名字对不上 = 未注册组件 = 灰卡。
   ══════════════════════════════════════════════════════════════ */

const MDX_COMPONENTS = {
  Text: function Text(props) {
    return renderTextComponent(props);
  },
  Markdown: function Markdown(props) {
    return renderMarkdownComponent(props);
  },
  Ask: function Ask(props) {
    return renderAskComponent(props);
  },
  Rank: function Rank(props) {
    return renderRankComponent(props);
  },
  Derive: function Derive(props) {
    return renderDeriveComponent(props);
  },
  Unknown: function Unknown(props) {
    return renderUnknownComponent(props);
  }
};

/**
 * 渲染一段 mdx 成 DOM。
 *
 * @param {string} mdx
 * @returns {HTMLElement|null}
 */
/**
 * 当前正在渲染的那条事项 + 它每章的 action。
 *
 * 为什么要这个：组件只拿到 props（值），不知道自己在哪。
 * 但改值要写回 —— 得知道「哪条事项的哪一章」。
 *
 * 用模块级变量而不是往下传，是因为组件表是按名字查的，
 * 签名统一是 (props) => HTMLElement，塞不进额外参数。
 */
let renderCtx = { taskId: '', keys: [], index: 0 };

/**
 * 渲染一段 mdx 成 DOM。
 *
 * @param {string} mdx
 * @param {{taskId?: string, keys?: string[]}} [ctx]
 * @returns {HTMLElement|null}
 */
function renderMdx(mdx, ctx) {
  const tags = parseTags(mdx);
  if (tags.length === 0) return null;

  renderCtx = {
    taskId: (ctx && ctx.taskId) || '',
    keys: (ctx && ctx.keys) || [],
    index: 0
  };

  const box = el('div', {class:'mdx'});
  for (const tag of tags) {
    const Component = MDX_COMPONENTS[tag.name];
    const key = renderCtx.keys[renderCtx.index] || '';
    renderCtx.index += 1;

    if (Component === undefined) {
      /* 未注册 = 程序集里没有这个类型。运行时才发现，画灰卡。 */
      box.appendChild(renderUnknownComponent({ name: tag.name, value: tag.attrs }));
      continue;
    }
    const node = Component({ ...tag.attrs, __key: key });
    if (node !== null) box.appendChild(node);
  }
  return box;
}

/* ══════════════════════════════════════════════════════════════
   写回

   行为在这里 —— mdx 里只写 <Ask options={...} picked="A" />，
   点了怎么变、改哪条数据，都是渲染器给的。
   ══════════════════════════════════════════════════════════════ */

/**
 * 改一章的值。支持部分字段更新。
 *
 * @param {object} props    组件 props（带 __key）
 * @param {object} patch    要改的字段
 */
function commit(props, patch) {
  if (renderCtx.taskId === '') return;
  const task = taskOf(renderCtx.taskId);
  if (task === undefined) return;

  const key = props.__key;
  if (key === '' || typeof task.body !== 'object' || task.body === null) return;

  const section = task.body[key];
  if (section === undefined) return;

  Object.assign(section, patch);
  scheduleSave();
  repaintBody();
}

/**
 * 只重绘正文，保住滚动位置和焦点。
 *
 * 用户原话：
 *
 *   > 我一旦失去焦点。这个东西就整个重新绘制。回到了顶端
 *
 * 之前 commit 调的是 renderAll()，整页重建 —— 正文区滚到哪、
 * 光标在哪个输入框，全丢。
 *
 * 现在只重绘 .d-body 里面，并且：
 *   · 记下滚动位置，重绘后还原
 *   · 记下焦点在哪个输入框、光标在第几个字符，重绘后还原
 */
/**
 * 只存，不重绘。
 *
 * 用于「用户正在输入」这种场景 —— 重绘会打断打字。
 *
 * @param {object} props
 * @param {object} patch
 */
function commitQuiet(props, patch) {
  if (renderCtx.taskId === '') return;
  const task = taskOf(renderCtx.taskId);
  if (task === undefined) return;
  const key = props.__key;
  if (key === '' || typeof task.body !== 'object' || task.body === null) return;
  const section = task.body[key];
  if (section === undefined) return;
  Object.assign(section, patch);
  scheduleSave();
}

function repaintBody() {
  const holder = document.querySelector('.d-body');
  if (holder === null) { renderAll(); return; }

  /* ① 记滚动 */
  const scroll = holder.scrollTop;

  /* ② 记焦点：哪个输入框、光标位置 */
  const active = document.activeElement;
  let focusInfo = null;
  if (active !== null && holder.contains(active) && (active.tagName === 'TEXTAREA' || active.tagName === 'INPUT')) {
    const all = [...holder.querySelectorAll('textarea, input[type="text"]')];
    focusInfo = { index: all.indexOf(active), start: active.selectionStart, end: active.selectionEnd };
  }

  /* ③ 重绘 */
  const task = taskOf(renderCtx.taskId);
  if (task === undefined) return;
  const fresh = renderBody(task);
  holder.innerHTML = '';
  if (fresh !== null) holder.appendChild(fresh);

  /* ④ 还原滚动。
     必须等下一帧：刚插进去时内容还没布局，scrollHeight 是旧的，
     直接 set 会被浏览器 clamp 到旧的高度。 */
  requestAnimationFrame(function () {
    holder.scrollTop = scroll;
  });

  /* ⑤ 还原焦点 */
  if (focusInfo !== null && focusInfo.index >= 0) {
    const all = [...holder.querySelectorAll('textarea, input[type="text"]')];
    const el2 = all[focusInfo.index];
    if (el2 !== undefined) {
      el2.focus();
      try { el2.setSelectionRange(focusInfo.start, focusInfo.end); } catch { /* 某些 input 不支持 */ }
    }
  }
}

/**
 * 单选：选中/取消。
 *
 * @param {object} props
 * @param {string} title
 */
function toggleAsk(props, title) {
  const current = String(props.picked || '');
  commit(props, { picked: current === title ? '' : title });
}

/**
 * 多选：加/删一项。
 *
 * @param {object} props
 * @param {string} title
 */
function toggleMulti(props, title) {
  const current = Array.isArray(props.picked) ? props.picked.slice() : [];
  const i = current.indexOf(title);
  if (i >= 0) current.splice(i, 1);
  else current.push(title);
  commit(props, { picked: current });
}

/**
 * 排序：上移/下移一项。
 *
 * @param {object} props
 * @param {number} index
 * @param {number} delta
 */
function moveItem(props, index, delta) {
  const items = Array.isArray(props.items) ? props.items.slice() : [];
  const target = index + delta;
  if (target < 0 || target >= items.length) return;
  const [moved] = items.splice(index, 1);
  items.splice(target, 0, moved);
  commit(props, { items });
}

/* ══════════════════════════════════════════════════════════════
   组件实现

   它们只接收 props（来自 mdx），不再接收 raw。
   ══════════════════════════════════════════════════════════════ */

function sectionShell(props, body) {
  const sec = el('div', {class:'sec'});
  const label = String(props.label || '');
  if (label !== '') {
    sec.appendChild(el('div', {class:'sec-title'},
      label,
      props.required === true ? el('span', {class:'req'}, ' *') : null));
  }
  body.forEach(function (node) {
    if (node !== null && node !== undefined) sec.appendChild(node);
  });
  if (props.description) {
    sec.appendChild(el('div', {class:'sec-desc'}, String(props.description)));
  }
  return sec;
}

function renderTextComponent(props) {
  const row = Number(props.row) > 0 ? Number(props.row) : 3;
  const value = String(props.value || '');
  const placeholder = String(props.placeholder || '');

  const box = el('div', {class:'inter'});
  if (row <= 1) {
    box.appendChild(el('input', {
      type:'text', value, placeholder, class:'text-input',
      onchange(e) { commit(props, { value: e.target.value }); }
    }));
  } else {
    const ta = el('textarea', {class:'text-input', rows:String(row), placeholder,
      onchange(e) { commit(props, { value: e.target.value }); }});
    ta.value = value;
    box.appendChild(ta);
  }
  return sectionShell(props, [box]);
}

function renderMarkdownComponent(props) {
  const text = String(props.value || '');
  const d = el('div', {class:'prose'});
  if (text.trim() === '') {
    d.appendChild(el('span', {class:'muted'}, String(props.placeholder || '（空）')));
  } else {
    d.innerHTML = md(text);
  }
  const label = String(props.label || '');
  if (label === '') return d;
  return sectionShell(props, [d]);
}

/**
 * 「未选择」这个按钮的文字。
 *
 * 用户原话：
 *   > 然后跳过，应该改名为"未选择"
 *
 * 它是「我没看这张卡片」，不是「都不要」——
 * 所以不能叫跳过，那听起来像已经看过并跳过了。
 */
const UNSET_LABEL = '未选择';

/* ══════════════════════════════════════════════════════════════
   选项卡 —— 照宿主那个 ask 的样式

   用户截图的要点：

     > 主标题，副标题，手动输入。
     > 他们没有选项点和选项框。选中了就是框框有焦点。
     > 自己填写的那个也是合法的选项框。
     > 渲染器给的渲染应该始终包含一个"未选择"或"跳过"。

   所以：
     · 不画圆点/方框，选中 = 整行加边框
     · 自定义输入框和选项长得一样
     · 「跳过」始终有
   ══════════════════════════════════════════════════════════════ */

/**
 * 一张选项卡的外壳：副标题（小字）+ 主标题（大字）。
 *
 * @param {object} props
 * @param {HTMLElement} list 选项列表
 * @returns {HTMLElement}
 */
function optionCard(props, list, skipActive, onSkip) {
  const card = el('div', {class:'oc'});

  const head = el('div', {class:'oc-head'});

  /* 上面一行：灰色小字（header）+ 右边的「跳过」 */
  const top = el('div', {class:'oc-top'});
  if (props.header) top.appendChild(el('span', {class:'oc-sub'}, String(props.header)));
  top.appendChild(el('span', {class:'oc-spacer'}));
  top.appendChild(el('button', {
    class: 'oc-skipbtn' + (skipActive ? ' on' : ''),
    type: 'button',
    title: '我没看这张卡片',
    onclick: onSkip
  }, UNSET_LABEL));
  head.appendChild(top);

  if (props.question) head.appendChild(el('div', {class:'oc-title'}, String(props.question)));
  else if (props.placeholder) head.appendChild(el('div', {class:'oc-title'}, String(props.placeholder)));

  card.appendChild(head);
  card.appendChild(list);
  return card;
}

/**
 * 一行选项。编号 + 粗体标题 + 灰字说明 + 可选「推荐」。
 *
 * @param {object} opt      { label, description, recommended }
 * @param {number} index    从 0 开始
 * @param {boolean} active  是否选中
 * @param {Function} onClick
 * @returns {HTMLElement}
 */
function optionRow(opt, index, active, onClick) {
  return el('button', {
    class: 'oc-row' + (active ? ' on' : ''),
    type: 'button',
    onclick: onClick
  },
    el('span', {class:'oc-no'}, String(index + 1)),
    el('span', {class:'oc-label'}, opt.label),
    opt.recommended ? el('span', {class:'oc-rec'}, '推荐') : null,
    opt.description ? el('span', {class:'oc-desc'}, opt.description) : null
  );
}


/**
 * 自己填的那一行。和普通选项长得一样，只是里面是输入框。
 *
 * @param {object} props
 * @param {string} current
 * @param {boolean} active
 * @returns {HTMLElement}
 */
function customRow(props, current, active, multi) {
  const input = el('input', {
    type: 'text',
    class: 'oc-input',
    placeholder: '自己填一个……',
    value: current,
    /*
     * oninput 而不是 onchange：
     *   onchange 要等失焦才触发，而失焦会重绘 —— 打字打到一半
     *   如果点了别处，重绘时 value 还是旧值，刚打的字就吞了。
     *
     * 而且这里用 commitQuiet：只存不重绘。
     * 输入框不用重画（用户正在里面打字），重画反而会打断。
     */
    oninput(e) {
      commitQuiet(props, multi
        ? { picked_multi: mergeCustom(props.pickedMulti, e.target.value) }
        : { picked: e.target.value });
      /* 打了字就把这行标成选中 */
      const row = e.target.closest('.oc-row');
      if (row !== null && e.target.value !== '') row.classList.add('on');
    },
    onblur(e) {
      /* 失焦时把「跳过」和其它选项的选中态刷新一下 */
      repaintBody();
    }
  });
  return el('div', {class:'oc-row oc-custom' + (active ? ' on' : '')},
    el('span', {class:'oc-no'}, '✎'),
    input);
}

/**
 * 多选时把自定义文字并进 picked 数组（保留序号项）。
 *
 * @param {unknown} picked
 * @param {string} text
 * @returns {string[]}
 */
function mergeCustom(picked, text) {
  const list = Array.isArray(picked) ? picked.filter(function (x) {
    return /^\d+$/u.test(String(x));
  }) : [];
  const trimmed = String(text || '').trim();
  if (trimmed !== '') list.push(trimmed);
  return list;
}

/**
 * ask —— 单选。
 *
 * @param {object} props
 * @returns {HTMLElement}
 */
/**
 * ask —— 单选或多选，同一个组件。
 *
 * ## 单选和多选怎么分
 *
 *   multi: true   picked 是数组（从 pickedMulti 来），点了加入/移出
 *   multi: false  picked 是字符串，点了替换
 *
 * 其余完全一样：卡片头、选项、自定义行、跳过行。
 *
 * ## 默认是「跳过」
 *
 * 用户原话：
 *   > 没看这个卡片应该是默认选择的。
 *
 * 所以没给 picked 时，按「跳过」渲染 —— 那一行是选中的。
 *
 * @param {object} props
 * @returns {HTMLElement}
 */
function renderAskComponent(props) {
  const options = Array.isArray(props.options) ? props.options : [];
  const multi = props.multi === true;

  /* 单选：字符串；多选：数组 */
  const single = String(props.picked === undefined || props.picked === null ? '' : props.picked);
  const list = Array.isArray(props.pickedMulti) ? props.pickedMulti.map(String) : [];

  /*
   * 「跳过」的定义收窄了。
   *
   * 用户原话（GU-06 第 3 条）：
   *   > "跳过"，应该是默认选择，并且点击才激活。
   *   > 没选择不自动等于没看见。
   *   > 因为多选有可能是看见了并且一个都不选。
   *
   * 所以「没选」不再等于「没看」：
   *
   *   picked === '跳过'      明确点了跳过
   *   其它（含空）           没跳过
   *
   * 但**默认要给 '跳过'** —— 那是初值。用户一旦动了选项就离开跳过。
   */
  /*
   * 多选也要能「未选择」。
   *
   * 之前写成 `!multi && ...` —— 多选的跳过按钮永远点不亮，
   * 因为 isSkip 恒为 false，点它只是清空数组，按钮没反应。
   *
   * 多选的两个独立状态：
   *   pickedMulti 是空数组 + 其它选项都没选   不一定是未选择
   *   点了「未选择」                          才是未选择
   *
   * 用 pickedMulti = ['未选择'] 这个哨兵值表示。
   */
  const UNSET = '未选择';
  const isSkip = multi ? list.length === 1 && list[0] === UNSET : single === UNSET;

  /* 单选时：序号 / 自定义文字 */
  const pickedIndex = !multi && /^\d+$/u.test(single) ? Number(single) : -1;
  const isCustom = !multi && !isSkip && pickedIndex < 0;

  const listBox = el('div', {class:'oc-list'});

  options.forEach(function (opt, i) {
    const key = String(i + 1);
    const active = multi ? list.includes(key) : pickedIndex === i + 1;
    listBox.appendChild(optionRow(opt, i, active, function () {
      if (multi) toggleMultiPick(props, key);
      else commit(props, { picked: key });
    }));
  });

  /* 自定义行 */
  const customText = multi
    ? list.filter(function (x) { return !/^\d+$/u.test(x); }).join('、')
    : (isCustom ? single : '');
  const hasCustom = multi
    ? list.some(function (x) { return !/^\d+$/u.test(x); })
    : isCustom;

  if (props.allowCustom !== false) {
    listBox.appendChild(customRow(props, customText, hasCustom, multi));
  }

  const card = optionCard(props, listBox, isSkip, function () {
    if (isSkip) {
      /* 再点一次取消「未选择」 */
      commit(props, multi ? { picked_multi: [] } : { picked: '' });
      return;
    }
    /* 选中「未选择」：多选要清掉其它选择 */
    commit(props, multi ? { picked_multi: ['未选择'] } : { picked: '未选择' });
  });

  if (multi && list.length > 0) {
    card.appendChild(el('div', {class:'oc-foot'}, '已选 ' + list.length + ' 项'));
  }
  return card;
}

/**
 * 多选：加/删一项。
 *
 * @param {object} props
 * @param {string} key
 */
function toggleMultiPick(props, key) {
  const current = Array.isArray(props.pickedMulti) ? props.pickedMulti.map(String) : [];
  const i = current.indexOf(key);
  if (i >= 0) current.splice(i, 1);
  else current.push(key);
  commit(props, { picked_multi: current });
}

function renderRankComponent(props) {
  const items = Array.isArray(props.items) ? props.items : [];
  const box = el('div', {class:'inter'});

  if (props.placeholder) {
    box.appendChild(el('div', {class:'inter-cap'}, String(props.placeholder)));
  }

  items.forEach(function (item, index) {
    const title = typeof item === 'string' ? item : String(item.title || '');
    const sub = typeof item === 'string' ? '' : String(item.placeholder || '');
    box.appendChild(el('div', {class:'rank-row'},
      el('span', {class:'no'}, String(index + 1)),
      el('span', {class:'rank-body'},
        el('span', {class:'rank-title'}, title),
        sub === '' ? null : el('span', {class:'rank-sub'}, sub)),
      el('span', {class:'rank-btns'},
        el('button', {type:'button', disabled: index === 0,
          onclick() { moveItem(props, index, -1); }}, '↑'),
        el('button', {type:'button', disabled: index === items.length - 1,
          onclick() { moveItem(props, index, 1); }}, '↓'))));
  });

  return sectionShell(props, [box]);
}

function renderDeriveComponent(props) {
  const templates = Array.isArray(props.templates) ? props.templates : [];
  const mode = String(props.mode || 'ask');

    });
    row.appendChild(el('button', {class:'quick-task', type:'button',
      onclick() { openCreator({ type: String(code) }); }},
      el('span', {class:'code'}, String(code)),
      tpl ? tpl.name : '派生任务',
      el('span', {class:'mode'}, modeLabel)));
  }
  box.appendChild(row);

  return sectionShell(props, [box]);
}

function renderUnknownComponent(props) {
  const name = String(props.name || '?');
  return el('div', {class:'sec'},
    el('div', {class:'unknown'},
      '未注册的交互类型「' + name + '」',
      el('pre', null, JSON.stringify(props.value || {}, null, 2))));
}


/* ══════════════════════════════════════════════════════════════
   建 DOM 的小工具

   整个沙盘不用框架，就靠这一个函数。
   class / style / onclick / 其它属性 / 子节点，一次搞定。
   ══════════════════════════════════════════════════════════════ */

function el(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === 'class') node.className = value;
    else if (key === 'style' && typeof value === 'object') Object.assign(node.style, value);
    else if (key.startsWith('on') && typeof value === 'function') {
      node.addEventListener(key.slice(2), value);
    } else if (key === 'hidden') {
      if (value) node.hidden = true;
    } else if (key === 'value') {
      node.value = value;
    } else {
      node.setAttribute(key, value);
    }
  }
  const append = (child) => {
    if (child === null || child === undefined || child === false) return;
    if (Array.isArray(child)) { child.forEach(append); return; }
    node.appendChild(typeof child === 'object' ? child : document.createTextNode(String(child)));
  };
  children.forEach(append);
  return node;
}

/* ══════════════════════════════════════════════════════════════
   正文渲染 —— 按行动分发

   ## 架构

   每个行动带五个公共字段（和 packages/actions 一致）：

     placeholder   灰字（输入框里 / 选项下方）
     label         这一章上方的标题（可缺省，缺省就用章节 id）
     row           高度；1 = 单行
     description   控件下方的详细说明
     required      必填（画星号）

   外加各自的业务字段：

     text      value
     markdown  value
     ask       options[{title, placeholder}] / picked / allow_custom / allow_defer
     rank      items[{title, placeholder}] / keep
     derive    templates[] / mode

   ## 为什么五个行动就够了

   用户原话：

     > 你的一个架构，就要描述掉一个渲染里的所有可能。

   所以渲染器只认得行动名，所有可见位置都从 schema 里读，
   不在渲染器里硬编码任何文案。
   ══════════════════════════════════════════════════════════════ */

/** 行动 → 渲染函数。别名（textarea / input / choose）也指向这里。 */


/**
 * 渲染正文 —— 走管道。
 *
 *   参数（json）
 *      ↓  compileBody()      （compiler.js）
 *   mdx 字符串
 *      ↓  renderMdx()        （mdx-runtime.js）
 *   界面
 *
 * 用户原话：
 *
 *   > 参数就是 .cs。然后渲染器给 mdx 就是 IL。
 *   > 最后外部渲染器渲染 mdx，就是 .net。
 *
 * @param {object} task
 * @returns {HTMLElement|null}
 */
function renderBody(task) {
  const mdx = compileBody(task);
  if (mdx === '') return null;
  return renderMdx(mdx, { taskId: task.id, keys: sectionKeys(task) });
}

/**
 * 按 compileBody 的顺序列出章节 id。
 *
 * 因为 renderMdx 是按标签顺序走的，得让两边顺序对上，
 * 否则改值会改错章。
 *
 * @param {object} task
 * @returns {string[]}
 */
function sectionKeys(task) {
  const body = task.body;
  if (body === null || typeof body !== 'object') return [];

  const sections = sectionsOf(task.type);
  const keys = [];
  for (const s of sections) {
    if (body[s.id] !== undefined) keys.push(s.id);
  }
  for (const key of Object.keys(body)) {
    if (!sections.some((s) => s.id === key)) keys.push(key);
  }
  return keys;
}

/**
 * 把一条事项的正文编成 mdx（调试用；页面上有个按钮可以看）。
 *
 * @param {object} task
 * @returns {string}
 */
function bodyAsMdx(task) {
  return compileBody(task);
}

function renderGroups() {

/**
 * 按当前筛选条件过滤。
 *
 * 三个维度可以同时生效：
 *   status  组 / 具体状态（「搁置」→ 需要补充 / 需要授权）
 *   kinds   类别（目标 / 设计 / 记录 / 工作）
 *   domains 领域（代码 / 写作 / 绘画 / 通用）
 *
 * 每个维度里选多个是「或」，不同维度之间是「与」。
 *
 * @returns {Array}
 */
function visibleTasks() {
  let list = DB.slice();

  /* 状态：选了组就按组，选了具体状态就按状态 */
  if (state.filterStatus.length > 0) {
    list = list.filter((t) => {
      if (state.filterStatus.includes('草稿')) {
        if (t.status === '未指定') return true;
      }
      const group = groupOf(t.status);
      if (state.filterStatus.includes(group)) return true;
      return state.filterStatus.includes(t.status);
    });
  }

  /* 类别 */
  if (state.filterKinds.length > 0) {
    list = list.filter((t) => state.filterKinds.includes(t.kind));
  }

  /* 领域 */
  if (state.filterDomains.length > 0) {
    list = list.filter((t) => state.filterDomains.includes(domainOf(t)));
  }

  /* 模板（从类别/领域的三级菜单里选的） */
  if (state.filterTypes.length > 0) {
    list = list.filter((t) => state.filterTypes.includes(t.type));
  }

  /* 搜索 */
  if (state.search.trim() !== '') {
    const q = state.search.trim().toLowerCase();
    list = list.filter((t) => (t.id + ' ' + t.title).toLowerCase().includes(q));
  }
  return list;
}

function renderRows() {
  const box = document.getElementById('rows');
  const list = visibleTasks();
  box.innerHTML = '';
  document.getElementById('count').textContent = '共 ' + list.length + ' 条';

  if (list.length === 0) {
    box.appendChild(el('div', {style:{padding:'30px 14px',textAlign:'center',color:'var(--text-3)',fontSize:'12px'}},
      '这一个筛选下没有事项。'));
    return;
  }
  for (const t of list) {
    const color = KIND_COLOR[t.kind] || 'var(--text-3)';
    box.appendChild(el('button', {
      class:'row' + (t.id === state.selected ? ' on' : ''),
      type:'button',
      onclick() { state.selected = t.id; state.menuOpen = false; state.relOpen = false; renderAll(); }
    },
      el('span', {class:'id', style:{color}}, t.id),
      el('span', {class:'kind', style:{color, background:KIND_COLOR[t.kind] ? 'rgba(0,0,0,.05)' : 'transparent'}}, KIND_LABEL[t.kind] || t.kind),
      el('span', {class:'title'}, t.title),

    ));

}

/* ══════════════════════════════════════════════════════════════
   渲染详情
   ══════════════════════════════════════════════════════════════ */
function renderDetail() {
  const box = document.getElementById('detail');
  box.innerHTML = '';
  const t = taskOf(state.selected);
  if (!t) { box.appendChild(el('div', {style:{padding:'40px',color:'var(--text-3)',textAlign:'center'}}, '选一条看详情')); return; }

  const color = KIND_COLOR[t.kind] || 'var(--text-3)';

  /* ── 头部 ── */
  /* 头部：编号在左、标题占右边整块。
     GU-02   用户任务：剩下没做完的 5 条
     目标 通用                      ← 编号下面半行放两个标签
     右下角三个图标

     用户原话：
       > 让标题大一点。GU-02 小一点。让 GU-02 在标题的左边，他们在一行。
       > 然后 GU-02 只有半行高度，他的下面半行放「目标」「通用」这两个 label。
       > 沙盘详情页的 label 写错了。「GU-02」的右边是「目标」。
       > 再右边应该是「领域」。而他是「GU」。冗余信息。 */
  /*
   * 采纳之后 = 锁定。
   *
   * 草稿（未指定）和重开后的「提交」都能改；
   * 一旦用户采纳（提交之后的任何状态），声明就冻结了。
   */
  const locked = t.status !== '未指定';

  const head = el('div', {class:'d-head'},
    el('div', {class:'d-head-grid'},
      /* 左列：编号 + 两个标签（编号只占半行高） */
      el('div', {class:'d-head-left'},
        el('span', {class:'id', style:{color}}, t.id),
        el('div', {class:'d-head-tags'},
          el('span', {class:'kind', style:{color, background:'rgba(0,0,0,.05)'}}, KIND_LABEL[t.kind] || t.kind),
          el('span', {class:'domain'}, DOMAIN_LABEL[domainOf(t)] || domainOf(t)))),
      /* 右列：标题 + 图标 */
      el('div', {class:'d-head-right'},
        el('div', {class:'d-head-title'}, t.title),
        el('div', {class:'d-head-icons'},
          /*
           * 采纳之后不准编辑、不准删除。
           *
           * 用户原话（GU-06 第 5 条）：
           *   > 采纳以后不准编辑。不准删除。
           *
           * 这和「采纳后声明冻结」是同一条规则 —— 采纳意味着这份声明
           * 被用户认可了，此后只能填值，不能改结构。
           */
          el('button', {
            class:'icon-btn' + (locked ? ' off' : ''), type:'button',
            title: locked ? '已采纳，不能编辑（要改先重开）' : '编辑标题与正文',
            disabled: locked,
            onclick(){ if (!locked) openEditor(t); }
          }, '✎'),
          el('button', {
            class:'icon-btn' + (locked ? ' off' : ''), type:'button',
            title: locked ? '已采纳，不能删除（要删先重开）' : '删除（连子事项）',
            disabled: locked,
            onclick(){
              if (locked) return;
              if (confirm('删除 ' + t.id + ' 和它下面所有子事项？')) deleteTask(t.id);
            }
          }, '🗑'),
          el('button', {class:'icon-btn', type:'button', title:'关闭',
            onclick(){ state.selected = ''; renderAll(); }}, '✕'))))
  );

  /* 状态标签 + 二级菜单 */
  const meta = el('div', {class:'d-meta'});
  const pill = el('button', {
    class:'status-pill', type:'button',
    style:{color:toneOf(t.status), borderColor: state.menuOpen ? toneOf(t.status) : 'transparent'},
    onclick(){ state.menuOpen = !state.menuOpen; renderAll(); }
  },
    el('span', {style:{fontSize:'8px'}}, '●'),
    t.status + ' · ' + groupOf(t.status),
    el('span', {style:{fontSize:'8px',opacity:'.7'}}, '▾'));
  meta.appendChild(pill);
  if (t.kind === 'goal') {
    meta.appendChild(el('span', {style:{padding:'1px 7px',borderRadius:'6px',
      border:'1px dashed var(--border-2)'}}, '推导：' + deriveGoalStatus(t)));
  }
  meta.appendChild(el('span', {style:{opacity:'.85'}}, '状态由用户或 AI 显式设置'));
  head.appendChild(meta);

  /* 菜单 */
  if (state.menuOpen) {
    /*
     * 目标的状态不能改，菜单改成「说明」。
     *
     * 用户原话（GU-06 第 6 条）：
     *   > "目标"的状态不能更改。点开以后的菜单应该是描述这个的状态只读，
     *   > 和状态判别依据（当前激活中的那个状态要高亮选中）
     *
     * 所以目标点开看到的是：
     *   · 每个可能的状态 + 它的判别依据
     *   · 当前处于哪个 —— 高亮
     *   · 没有任何可点的按钮
     */
    if (t.kind === 'goal') {
      const menu = el('div', {class:'status-menu goal-menu'},
        el('div', {class:'menu-cap'}, '目标的推导状态（不是手动设的）'));

      const derived = deriveGoalStatus(t);
      for (const row of GOAL_STATES) {
        const on = row.key === derived;
        menu.appendChild(el('div', {class:'goal-row' + (on ? ' on' : '')},
          el('span', {class:'goal-mark'}, on ? '●' : '○'),
          el('span', {class:'goal-body'},
            el('span', {class:'goal-name'}, row.key),
            el('span', {class:'goal-why'}, row.why))));
      }

      menu.appendChild(el('div', {class:'menu-note'},
        '目标的状态由子事项推导。要推进它，去推进子事项 —— 这里不给按钮。'));
      head.appendChild(menu);
    } else {
      const menu = el('div', {class:'status-menu'},
        el('div', {class:'menu-cap'}, '变更状态'));
      const actions = TRANSITIONS[t.status] || [];
      for (const a of actions) {
        menu.appendChild(el('button', {
          class:'menu-item' + (a.primary ? ' primary' : '') + (a.bad ? ' bad' : ''),
          type:'button',
          onclick(){
            patchTask(t.id, { status: a.to });
            state.menuOpen = false;
            renderAll();
          }
        }, el('span', {class:'ic'}, a.primary ? '▶' : a.bad ? '✕' : '·'), a.label));
      }
      menu.appendChild(el('div', {class:'menu-note'},
        '状态变更会影响 AI 能否继续这张单，所以都收在这里。'));
      head.appendChild(menu);
    }
  }
  box.appendChild(head);

  /* ── 父任务栏 ── */
  const children = DB.filter((x) => x.parent === t.id).map((x) => x.id);
  const outLinks = [];
  const inLinks = DB.filter((x) => x.links && x.links.includes(t.id)).map((x) => x.id);
  /* 计数只算展开面板里真有的：子任务 + 出边 + 入边。
     父任务不算 —— 它在上面单独一格，面板里没有它。
     （之前 + (t.parent ? 1 : 0) 导致 WI-03 只有父节点却显示「关系 1」） */
  const relCount = children.length + outLinks.length + inLinks.length;

  const parentRow = el('div', {class:'parent-row'},
    el('button', {
      class:'rel-toggle', type:'button', 'aria-expanded': state.relOpen ? 'true' : 'false',
      onclick(){ state.relOpen = !state.relOpen; renderAll(); }
    },
      el('span', {class:'chev'}, '▶'), '展开关系', el('span', {class:'n'}, String(relCount))));

  if (t.parent) {
    parentRow.appendChild(el('span', {class:'vsep'}));
    parentRow.appendChild(el('span', {class:'pcap'}, '父任务'));
    parentRow.appendChild(el('button', {
      class:'pbtn', type:'button',
      onclick(){ state.selected = t.parent; renderAll(); }
    }, t.parent));
  }
  parentRow.appendChild(el('button', {
    class:'derive-btn', type:'button',
    onclick(){ openCreator({ parent: t.id }); }
  }, el('span', {style:{color:'var(--text-3)'}}, '＋'), '派生子任务'));
  box.appendChild(parentRow);

  /* ── 关系网 ── */
  if (state.relOpen) {
    const relBody = el('div', {class:'rel-body'});
    if (relCount === 0) {
      relBody.appendChild(el('div', {style:{fontSize:'11.5px',color:'var(--text-3)',padding:'10px 0'}},
        '这一条还没有任何关系。'));
    } else {
      relBody.appendChild(el('div', {class:'rel-headrow'},
        el('div', {class:'rel-head active'}, '进行'),
        el('div', {class:'rel-head held'}, '搁置'),
        el('div', {class:'rel-head done'}, '完成')));

      const blockOf = (title, ids, color) => {
        const entries = ids.map((id) => taskOf(id)).filter(Boolean);
        if (entries.length === 0) return null;
        const cols = [[], [], []];
        for (const e of entries) {
          const g = groupOf(e.status);
          cols[g === '搁置' ? 1 : g === '完成' ? 2 : 0].push(e);
        }
        return el('div', {class:'rel-block'},
          el('div', {class:'rel-banner', style:{borderLeftColor:color}}, title,
            el('span', {style:{opacity:'.75'}}, String(entries.length))),
          el('div', {class:'rel-cells'},
            ...cols.map((bucket) => el('div', {class:'rel-cell' + (bucket.length === 0 ? ' void' : '')},
              ...bucket.map((e) => el('button', {
                class:'rel-item', type:'button',
                onclick(){ state.selected = e.id; renderAll(); }
              }, el('span', {style:{color:toneOf(e.status),fontSize:'8px'}}, '●'), e.id))))) );
      };

      const b1 = blockOf('子任务', children, 'var(--brand)');
      const b2 = blockOf('被依赖', inLinks, 'var(--warn)');
      if (b1) relBody.appendChild(b1);
      if (b2) relBody.appendChild(b2);
    }
    box.appendChild(relBody);
  }

  /*
   * ── 元数据 ──
   *
   * 用户原话（GU-06 第 4 条）：
   *   > 子工作空间，临时工作目录，权限。这几个元数据还没显示。
   *
   * 放成一张小表，两列：名字 / 值。没设的显示「（未指定）」。
   */
  const str = function (v) { return v === undefined || v === null ? '' : String(v); };
  const metaRows = [
    ['子工作区', str(t.workspace)],
    ['临时工作区', str(t.tmpWorkspace)],
    ['额外可读', str(t.workspaces)],
    ['权限', str(t.permission)],
    ['再收窄', str(t.deny)],
    ['标记', Array.isArray(t.tags) && t.tags.length > 0 ? t.tags.join('、') : '']
  ];
  /*
   * 用户原话（GU-06 第 4 条）：
   *   > 子工作空间，临时工作目录，权限。这几个元数据还没显示。
   *
   * 注意是「没显示」——不是「没有」。所以没设也要画出来，
   * 值写「（未指定）」。全藏起来的话，用户根本不知道有这几个字段。
   */

  let metaBox = null;
  if (metaRows.length > 0) {
    metaBox = el('div', {class:'d-meta-block'});
    for (const [name, value] of metaRows) {
      metaBox.appendChild(el('div', {class:'d-meta-row'},
        el('span', {class:'d-meta-name'}, name),
        el('span', {class:'d-meta-value' + (String(value).trim() === '' ? ' none' : '')},
          String(value).trim() === '' ? '（未指定）' : String(value))));
    }
  }

  /* ── 正文（滚动区）──
   *
   * 用户原话：
   *   > 参数就是 .cs。然后渲染器给 mdx 就是 IL。
   *
   * 所以这里加一个「看 mdx」开关 —— 直接看到这条事项被编译成什么，
   * 不用开 devtools。 */
  const body = el('div', {class:'d-body'});
  if (metaBox !== null) body.appendChild(metaBox);
  body.appendChild(el('div', {class:'sec'},
    el('div', {class:'sec-title'},
      '正文',
      el('button', {
        class:'link-btn', type:'button', style:{marginLeft:'auto'},
        onclick() {
          state.showMdx = !state.showMdx;
          renderAll();
        }
      }, state.showMdx ? '看渲染' : '看 mdx')),
    state.showMdx
      ? (function () {
          const mdx = bodyAsMdx(t);
          const pre = el('pre', {class:'mdx-source'});
          pre.textContent = mdx === '' ? '（空）' : mdx;
          return pre;
        })()
      : (renderBody(t) || el('div', {class:'prose', style:{color:'var(--text-3)'}}, '（没有正文）'))));

  /* 备注只在有内容时作为只读文字显示。
     编辑用的是底部固定栏那个输入框，不在这里重复。 */
  if (String(t.note || '').trim() !== '') {
    body.appendChild(el('div', {class:'sec'},
      el('div', {class:'sec-title'}, '备注'),
      el('div', {class:'prose', style:{color:'var(--text-2)'}}, t.note)));
  }
  box.appendChild(body);

  /* ── 固定底部备注 ── */
  box.appendChild(el('div', {class:'d-foot'},
    el('textarea', {
      class:'ta',
      placeholder:'备注 / 搁置理由（随时写，不跟着内容滚）',
      value: t.note || '',
      onchange(e){ patchTask(t.id, { note: e.target.value }); }
    })));
}

/**
 * 目标的四种推导态 + 判别依据。
 *
 * 用户原话：
 *   > 点开以后的菜单应该是描述这个的状态只读，和状态判别依据
 *   > （当前激活中的那个状态要高亮选中）
 */
const GOAL_STATES = [
  { key: '未开始', why: '还没有子事项，或者子事项全是草稿' },
  { key: '进行中', why: '有子事项在「进行」组（提交 / 处理中）' },
  { key: '停滞', why: '没有进行中的，但有子事项卡在等待（需要补充 / 需要授权）' },
  { key: '收尾', why: '所有子事项都在「完成」组' }
];

function deriveGoalStatus(t) {
  const kids = DB.filter((x) => x.parent === t.id);
  if (kids.length === 0) return '未开始';
  const groups = kids.map((k) => groupOf(k.status));
  /* 全部完成态 → 收尾；有进行 → 进行中；有搁置 → 停滞；否则未开始 */
  if (groups.every((g) => g === '完成')) return '收尾';
  if (groups.some((g) => g === '进行')) return '进行中';
  if (groups.some((g) => g === '搁置')) return '停滞';
  return '未开始';
}

function renderAll() {
  renderFilters();

  const listBox = document.getElementById('rows');
  const treeBox = document.getElementById('treeview');
  const isTree = state.view === 'tree';
  listBox.hidden = isTree;

function escClose(e) { if (e.key === 'Escape') closeModal(); }

}

/** 打开新建浮层。 */
function openCreator(init) {
  closeModal();
  const draft = {
    title: '',
    parent: (init && init.parent) || '',

    tmpWorkspace: '',

/* ══════════════════════════════════════════════════════════════
   过滤栏 —— 横向展开

   用户原话（GU-06 第 2 条）：

     > 筛选的过滤器。我要的是横向的展开。不是竖的。行为是：
     > 按钮默认写着   >状态<
     > 点击以后变成   >状态|进行|搁置|完成
     > 再次点击"状态"，或者没有选中类别进行筛选就失去焦点，那么他就会收回。
     > 如果点击了筛选，他就会保持展开，同时，那个按钮还会进一步展开。
     > 状态|进行|搁置-需要信息/需要授权|完成

   ## 三态

     ① 收起         `>状态<`
     ② 展开一级     `>状态|进行|搁置|完成<`
     ③ 展开二级     `>状态|进行|搁置-需要信息/需要授权|完成<`

   ②→③ 的触发：点了某一项。
   ③ 里那一项变成 `搁置-需要信息/需要授权`（用 `-` 挂子项）。

   ## 什么时候收回

     · 再点「状态」那一格
     · 没选任何项就失焦

   选了项就**保持展开**（因为有筛选生效，得看得见）。
   ══════════════════════════════════════════════════════════════ */

/** 三个过滤维度的定义：key / 面包屑 / 组 / 组下的子项 */
const FILTER_DEFS = [
  {
    key: 'status',
    label: '状态',
    groups: [
      { key: '进行', children: ['提交', '处理中'] },
      { key: '搁置', children: ['需要补充', '需要授权'] },
      { key: '完成', children: ['完成', '失败', '取消'] },
      { key: '草稿', children: ['未指定'] }
    ]
  },
  {
    key: 'kind',
    label: '类别',
    groups: [
      { key: 'goal', label: '目标', children: [] },
      { key: 'design', label: '设计', children: [] },
      { key: 'record', label: '记录', children: [] },
      { key: 'work', label: '工作', children: [] }
    ]
  },
  {
    key: 'domain',
    label: '领域',
    groups: [
      { key: 'code', label: '代码', children: [] },
      { key: 'writing', label: '写作', children: [] },
      { key: 'art', label: '绘画', children: [] },
      { key: 'general', label: '通用', children: [] }
    ]
  }
];

/**
 * 渲染过滤栏。
 *
 * state 里用到：
 *   filterOpen   哪个维度是展开的（'' = 全收起）
 *   filterSub    哪个组展开了子项
 *   filterStatus / filterKinds / filterDomains  选中的值
 */
function renderFilters() {
  const box = document.getElementById('filters');
  if (box === null) return;
  box.innerHTML = '';

  const bar = el('div', {class:'fb'});

  for (const def of FILTER_DEFS) {
    const picked = pickedOf(def.key);
    const open = state.filterOpen === def.key;

    bar.appendChild(el('div', {class:'fb-group' + (open ? ' open' : '') + (picked.length ? ' has' : '')},
      /* 维度名那一格 —— 点它展开/收回 */
      el('button', {
        class:'fb-name', type:'button',
        onclick(event) {
          event.stopPropagation();
          if (state.filterOpen === def.key) {
            /* 再点一次：收回（前提是没选东西；选了就保留） */
            state.filterOpen = '';
            state.filterSub = '';
          } else {
            state.filterOpen = def.key;
            state.filterSub = '';
          }
          renderFilters();
          renderAll();
        }
      },
        el('span', {class:'fb-chev'}, open ? '▾' : '▸'),
        def.label),

      /* 展开后：每一项一格，横向排 */
      open ? def.groups.map(function (group) {
        const active = picked.includes(group.key);
        const hasSub = group.children.length > 0;
        const subOpen = state.filterSub === group.key;

        /* 这一格的文字：没展开子项就是组名，展开了就是 `组名-子项/子项` */
        const text = subOpen && hasSub
          ? group.key + '-' + group.children.join('/')
          : (group.label || group.key);

        return el('span', {class:'fb-item' + (active ? ' on' : ''), key: group.key},
          el('span', {
            class:'fb-item-name',
            onclick(event) {
              event.stopPropagation();
              /* 点这一项：选中/取消 + 展开它的子项 */
              togglePick(pickedOf(def.key), group.key);
              state.filterSub = (subOpen || !hasSub) ? '' : group.key;
              renderFilters();
              renderAll();
            }
          }, text),

          /* 子项不单独列 —— 用户要的就是
             「搁置-需要信息/需要授权」这一整格。
             点这一格 = 选中「搁置」组。 */);
      }) : null));
  }

  /* 清空 */
  const total = state.filterStatus.length + state.filterKinds.length + state.filterDomains.length;
  if (total > 0) {
    bar.appendChild(el('button', {
      class:'fb-clear', type:'button',
      onclick() {
        state.filterStatus = [];
        state.filterKinds = [];
        state.filterDomains = [];
        state.filterOpen = '';
        state.filterSub = '';
        renderFilters();
        renderAll();
      }
    }, '清空'));
  }

  /* 搜索 */
  bar.appendChild(el('input', {
    class:'search', type:'search', placeholder:'搜编号或标题…',
    value: state.search,
    oninput(e) { state.search = e.target.value; renderAll(); }
  }));

  box.appendChild(bar);

  /* 失焦收回：点空白处，如果没选东西就收起 */
  if (state.filterOpen !== '') {
    setTimeout(function () {
      const handler = function (event) {
        if (box.contains(event.target)) return;
        if (pickedOf(state.filterOpen).length === 0) {
          state.filterOpen = '';
          state.filterSub = '';
          renderFilters();
          renderAll();
        }
        document.removeEventListener('pointerdown', handler);
      };
      document.addEventListener('pointerdown', handler);
    }, 0);
  }
}

/**
 * 某个维度已选的值。
 *
 * @param {string} key
 * @returns {string[]}
 */
function pickedOf(key) {
  if (key === 'status') return state.filterStatus;
  if (key === 'kind') return state.filterKinds;
  return state.filterDomains;
}

/** 在数组里加/删一项。 */
function togglePick(list, key) {
  const i = list.indexOf(key);
  if (i >= 0) list.splice(i, 1);
  else list.push(key);
}

/* ══════════════════════════════════════════════════════════════
   图例 —— 每种关系一种颜色
   ══════════════════════════════════════════════════════════════ */
function renderLegend() {
  const box = document.getElementById('legend');
  if (box === null) return;
  box.innerHTML = '';
  for (const kind of LINK_KINDS) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', '16');
    svg.setAttribute('height', '8');
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', '0');
    line.setAttribute('y1', '4');
    line.setAttribute('x2', '16');
    line.setAttribute('y2', '4');
    line.setAttribute('stroke', kind.color);
    line.setAttribute('stroke-width', '1.6');
    if (kind.dashed) line.setAttribute('stroke-dasharray', '4 3');
    svg.appendChild(line);
    box.appendChild(el('span', {class:'lg', title: kind.label}, svg, kind.label));
  }
}


/* ══════════════════════════════════════════════════════════════
   启动与事件绑定

   ## 为什么单独一段

   基线里是同步启动（`renderAll(); loadDraft();`），因为数据在 localStorage，
   当场就有。现在数据要**先从服务端取**，所以启动变成异步：

     连服务 → 拿到数据 → 选中第一项 → 渲染 → 读草稿

   如果中途服务没起，loadFromServer 会退回内置样本并提示「本地模式」。
   ══════════════════════════════════════════════════════════════ */

/* ── 顶部按钮 ── */
const newBtn = document.getElementById('newBtn');
if (newBtn) newBtn.addEventListener('click', () => openCreator({}));

const resetBtn = document.getElementById('resetBtn');
if (resetBtn) {
  resetBtn.addEventListener('click', () => {
    if (confirm('重置成最初的样本？当前改动会丢。')) resetDB();
  });
}

/* ── 视图切换：科技树 / 列表 ── */
document.querySelectorAll('.vw').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.vw').forEach((b) => b.classList.remove('on'));
    btn.classList.add('on');
    state.view = btn.dataset.view;
    renderAll();
  });
});

/* ── 底部自由文本 ── */
const exportBtn = document.getElementById('exportBtn');
if (exportBtn) exportBtn.addEventListener('click', () => { saveDraft(); });

const clearBtn = document.getElementById('clearBtn');
if (clearBtn) {
  clearBtn.addEventListener('click', () => {
    if (!confirm('清空这段自由文本？')) return;
    const ta = document.getElementById('draft');
    if (ta) ta.value = '';
    saveDraft();
    updateHint();
  });
}

/* ── 启动 ── */
(async function boot() {
  setSyncState('正在连接…', false);
  const ok = await loadFromServer();
  if (ok) setSyncState('已连上服务 · ' + DB.length + ' 条', false);
  if (!DB.some((t) => t.id === state.selected)) {
    state.selected = DB[0] ? DB[0].id : '';
  }
  renderAll();
  await loadDraft();
})();

</script>
</body>
</html>
